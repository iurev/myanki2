- id: 0678
  suspended: "Como está? is not simply “formal”; it is the 3rd-person/polite-address form and can be used with o senhor/a senhora/você or omitted subject. The register label is oversimplified."
  skipped: "reason_phrase"
  word: Como está?
  front: "How are you? (polite / 3rd-person address)"
  back: "Como está?<br>How are you?<br><br><b>Como está?</b> uses the 3rd-person verb form and is appropriate with polite/implicit <i>você / o senhor / a senhora</i> depending context. Contrast informal <b>Como estás?</b>."
  chapter: —
- id: 0679
  suspended: "Como estás? is specifically tu 2nd-person singular. “informal” is broadly right but the grammatical reason matters more than the label."
  skipped: "reason_phrase"
  word: Como estás?
  front: "How are you? (informal <i>tu</i>)"
  back: "Como estás?<br>How are you?<br><br><b>estás</b> is the <i>tu</i> form of <i>estar</i>. Contrast polite/3rd-person <b>Como está?</b>."
  chapter: —
