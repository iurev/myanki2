name: Build Tesouro listening deck

on:
  push:
    branches:
      - feature/tesouro-listening-ch1
    paths:
      - tools/build_tesouro_listening.py
      - tesouro/alignment-ch01-10.csv
      - extracted/OEBPS/upart-002-chapter-*.xhtml
      - .github/workflows/build-tesouro-listening.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tesouro-listening-ch1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Debug chapter 1 pairs
        run: |
          python3 - <<'PY'
          from tools.build_tesouro_listening import story_pairs
          for i, pair in enumerate(story_pairs(1), 1):
              print(i, repr(pair[0]), '=>', repr(pair[1]))
          PY
      - name: Generate deck
        run: python3 tools/build_tesouro_listening.py
      - name: Validate YAML
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          import csv, yaml
          cfg = yaml.safe_load(open('tesouro-listening.yaml', encoding='utf-8'))
          assert cfg['deck'] == 'tesouro-listening'
          cards = cfg['cards']
          assert len(cards) == 312, len(cards)
          assert cards[0]['id'] == 'ts0001'
          assert cards[-1]['id'] == 'ts0312'
          assert len({c['id'] for c in cards}) == 312
          assert all(c['front'] == '' for c in cards)
          assert all('<br>' in c['back'] for c in cards)
          fallbacks = list(csv.DictReader(open('tesouro/translation-fallbacks.csv', encoding='utf-8')))
          print(f'validated 312 cards; translation fallbacks={len(fallbacks)}')
          PY
      - name: Commit generated files
        run: |
          if git diff --quiet -- tesouro-listening.yaml tesouro/translation-fallbacks.csv; then
            echo 'generated files already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesouro-listening.yaml tesouro/translation-fallbacks.csv
          git commit -m 'Generate chapters 1-10 Tesouro listening cards'
          git push origin HEAD:feature/tesouro-listening-ch1
