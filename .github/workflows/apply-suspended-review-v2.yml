name: Apply suspended card review v2

on:
  push:
    branches:
      - review/suspended-portuguese-cards
    paths:
      - .github/workflows/apply-suspended-review-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/suspended-portuguese-cards
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependencies
        run: python -m pip install --disable-pip-version-check pyyaml ruamel.yaml

      - name: Apply approved review directly to source YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML
          import yaml as pyyaml

          root = Path('.')
          review_dir = root / 'suspended-review'

          def source_for_id(card_id):
              n = int(card_id)
              if n <= 185: return root / 'verbs.yaml'
              if n <= 468: return root / 'nouns.yaml'
              if n <= 570: return root / 'adjectives.yaml'
              if n <= 589: return root / 'location.yaml'
              if n <= 619: return root / 'numbers.yaml'
              return root / 'phrases.yaml'

          reviews = []
          for path in sorted(review_dir.glob('*.yaml')):
              data = pyyaml.safe_load(path.read_text(encoding='utf-8')) or {}
              reviews.extend(data.get('cards', []))
          assert len(reviews) == 134, f'expected 134 review records, got {len(reviews)}'

          by_source = {}
          for review in reviews:
              by_source.setdefault(source_for_id(str(review['id'])), []).append(review)

          ryaml = YAML()
          ryaml.preserve_quotes = True
          ryaml.width = 1000
          ryaml.indent(mapping=2, sequence=4, offset=2)

          repaired_cards = set()
          for source, source_reviews in by_source.items():
              with source.open('r', encoding='utf-8') as f:
                  doc = ryaml.load(f)
              indexed = {str(card.get('id')).zfill(4): card for card in doc.get('cards', [])}
              for review in source_reviews:
                  cid = str(review['id']).zfill(4)
                  card = indexed[cid]
                  reason = str(review['suspended'])
                  if 'suspended' in card:
                      card['suspended'] = reason
                  elif hasattr(card, 'insert'):
                      card.insert(1, 'suspended', reason)
                  else:
                      card['suspended'] = reason
                  if review.get('proposed_front'):
                      card['front'] = str(review['proposed_front'])
                      repaired_cards.add(cid)
                  if review.get('proposed_back'):
                      card['back'] = str(review['proposed_back'])
                      repaired_cards.add(cid)
              with source.open('w', encoding='utf-8') as f:
                  ryaml.dump(doc, f)

          print(f'applied {len(reviews)} reviews; repaired front/back on {len(repaired_cards)} cards')
          PY

      - name: Verify all approved changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('.')
          def source_for_id(card_id):
              n = int(card_id)
              if n <= 185: return root / 'verbs.yaml'
              if n <= 468: return root / 'nouns.yaml'
              if n <= 570: return root / 'adjectives.yaml'
              if n <= 589: return root / 'location.yaml'
              if n <= 619: return root / 'numbers.yaml'
              return root / 'phrases.yaml'

          reviews = []
          for path in sorted((root / 'suspended-review').glob('*.yaml')):
              data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              reviews.extend(data.get('cards', []))

          source_indexes = {}
          for review in reviews:
              source = source_for_id(str(review['id']))
              if source not in source_indexes:
                  doc = yaml.safe_load(source.read_text(encoding='utf-8')) or {}
                  source_indexes[source] = {str(c.get('id')).zfill(4): c for c in doc.get('cards', [])}

          repaired_cards = set()
          for review in reviews:
              cid = str(review['id']).zfill(4)
              card = source_indexes[source_for_id(cid)][cid]
              assert card.get('suspended') == review['suspended'], f'{cid}: suspended reason mismatch'
              if review.get('proposed_front'):
                  assert card.get('front') == review['proposed_front'], f'{cid}: front mismatch'
                  repaired_cards.add(cid)
              if review.get('proposed_back'):
                  assert card.get('back') == review['proposed_back'], f'{cid}: back mismatch'
                  repaired_cards.add(cid)

          migration = [line.strip() for line in (root / 'migrations/unsuspend-after-suspended-review.txt').read_text().splitlines() if line.strip() and not line.lstrip().startswith('#')]
          assert len(reviews) == 134
          assert len(repaired_cards) == 79, f'expected 79 repaired cards, got {len(repaired_cards)}'
          assert len(migration) == 72, f'expected 72 unsuspend candidates, got {len(migration)}'
          assert set(migration) <= {str(r['id']).zfill(4) for r in reviews}
          print(f'verified 134 reviewed cards, 79 repaired cards, and 72 unsuspend candidates')
          PY

      - name: Remove proposal machinery
        run: |
          rm -rf suspended-review
          rm -f tools/apply_suspended_review.py
          rm -f .github/workflows/apply-suspended-review.yml
          rm -f .github/workflows/apply-suspended-review-v2.yml

      - name: Commit applied source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Apply suspended-card repairs to source YAML"
          git push origin HEAD:review/suspended-portuguese-cards
