name: Apply suspended card review

on:
  push:
    branches:
      - review/suspended-portuguese-cards
    paths:
      - .github/workflows/apply-suspended-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/suspended-portuguese-cards
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Apply approved review
        run: python tools/apply_suspended_review.py --apply

      - name: Replace proposal overlay with applied source changes
        run: |
          rm -rf suspended-review
          rm -f tools/apply_suspended_review.py
          rm -f .github/workflows/apply-suspended-review.yml

      - name: Verify expected metadata and migration IDs
        run: |
          python - <<'PY'
          import pathlib, yaml

          root = pathlib.Path('.')
          files = ['verbs.yaml', 'nouns.yaml', 'adjectives.yaml', 'location.yaml', 'phrases.yaml']
          reviewed = []
          for name in files:
              data = yaml.safe_load((root / name).read_text(encoding='utf-8')) or {}
              for card in data.get('cards', []):
                  if card.get('suspended'):
                      reviewed.append(str(card['id']).zfill(4))

          assert len(reviewed) == 134, f'expected 134 reviewed suspended cards, got {len(reviewed)}'

          migration = [
              line.strip() for line in (root / 'migrations/unsuspend-after-suspended-review.txt').read_text().splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          assert len(migration) == 72, f'expected 72 conservative unsuspend ids, got {len(migration)}'
          assert set(migration) <= set(reviewed), 'migration contains ids without suspended review metadata'
          print(f'verified {len(reviewed)} reviewed cards and {len(migration)} unsuspend candidates')
          PY

      - name: Commit applied YAML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Apply suspended-card repairs to source YAML"
          git push origin HEAD:review/suspended-portuguese-cards
