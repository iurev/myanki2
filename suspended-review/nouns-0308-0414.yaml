cards:
- id: '0310'
  word: reserva
  suspended: 'This belongs to the mass-suspended “Eu vejo…” batch. reserva is polysemous: reservation/booking, reserve, stock. “I see a reservation” is unnatural.'
  recommendation: rewrite_then_review
  review_note: 'Rewrite in restaurant/hotel context: “Tenho uma reserva em nome de…”'
  proposed_front: Tenho uma {{reservation}} em nome de Ana.
  proposed_back: Tenho uma reserva em nome de Ana.<br>I have a reservation under the name Ana.<br><br><b>reserva</b> has several meanings; the restaurant/hotel booking context removes the ambiguity. <b>em nome de</b> = under/in the name of.
- id: '0311'
  word: restaurante
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. restaurante is transparent/basic and “I see the restaurant” adds no value.
  recommendation: keep_suspended
  review_note: Keep suspended.
- id: '0312'
  word: rua
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. rua normally means street, not generic “road”. The English cue is imprecise.
  recommendation: rewrite_then_review
  review_note: REWRITE to street and use an address/directions context.
  proposed_front: Moro nesta {{street}}.
  proposed_back: Moro nesta rua.<br>I live on this street.<br><br><b>rua</b> = street. English “road” is too broad as a cue; <b>nesta = em + esta</b>.
- id: '0313'
  word: supermercado
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. supermercado is transparent and basic; template adds no value.
  recommendation: keep_suspended
  review_note: Keep suspended.
- id: '0314'
  word: templo
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. templo is transparent and lower priority for everyday speech.
  recommendation: keep_suspended
  review_note: Keep suspended.
- id: '0315'
  word: torre
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. torre is useful reading/travel vocab, but the template is generic.
  recommendation: rewrite_then_review
  review_note: Rewrite only if travel/reading vocabulary matters.
- id: '0316'
  word: blusa
  suspended: blusa can map to blouse/top and is clothing-specific; “I wear the blouse” is generic.
  recommendation: rewrite_then_review
  review_note: Low priority unless clothing matters; rewrite with shopping context.
  proposed_front: Tem esta {{blouse}} noutra cor?
  proposed_back: Tem esta blusa noutra cor?<br>Do you have this blouse in another colour?<br><br>This shopping context makes <b>blusa</b> useful in real life. <b>noutra = em + outra</b>.
- id: '0320'
  word: cinto
  suspended: cinto is useful but current template gives no situational value.
  recommendation: rewrite_then_review
  review_note: Rewrite in clothing/security context.
  proposed_front: Tenho de apertar o {{belt}}.
  proposed_back: Tenho de apertar o cinto.<br>I need to tighten the belt.<br><br><b>cinto</b> = belt; <b>apertar</b> = tighten/fasten/squeeze depending context.
- id: '0324'
  word: sapato
  suspended: sapato is basic and the generic sentence is easy; after a few reps it may simply have been redundant.
  recommendation: keep_suspended
  review_note: Keep suspended or rewrite as a shopping-size phrase.
- id: '0327'
  word: avô
  suspended: avô is useful, but the real learning value is the avô/avó pronunciation and accent contrast, not the generic sentence.
  recommendation: rewrite_then_review
  review_note: Rewrite as a contrast card avô (grandfather) vs avó (grandmother).
  proposed_front: O meu {{grandfather}} chama-se João.
  proposed_back: O meu avô chama-se João.<br>My grandfather is called João.<br><br><b>avô</b> = grandfather; <b>avó</b> = grandmother. The written accent distinguishes the pair.
- id: '0365'
  word: vinho branco
  suspended: vinho branco is transparent as a phrase and the sentence is low-information.
  recommendation: keep_suspended
  review_note: Keep suspended unless restaurant vocabulary needs it.
- id: 0369
  word: candeeiro
  suspended: candeeiro is a useful Portugal-specific household word; “I clean the lamp” is unnatural as a teaching context.
  recommendation: rewrite_then_review
  review_note: Rewrite around turning a lamp on/off or asking where it is.
  proposed_front: Pode acender o {{lamp}}?
  proposed_back: Pode acender o candeeiro?<br>Can you turn on the lamp?<br><br><b>candeeiro</b> in European Portuguese = lamp/light fixture. <b>acender</b> = switch/light it on.
- id: '0370'
  word: canto
  suspended: 'canto is polysemous: corner, singing/song (and verb form canto = I sing). The English cue picks one sense but the note remains collision-prone.'
  recommendation: rewrite_then_review
  review_note: Rewrite explicitly as canto = corner, with room/location context.
  proposed_front: A cadeira está no {{corner}} da sala.
  proposed_back: A cadeira está no canto da sala.<br>The chair is in the corner of the room.<br><br><b>canto</b> can also mean “song/singing”; this location context forces the “corner” sense.
- id: '0372'
  word: casa
  suspended: There is already an unsuspended casa card for “house”; this one tests “home”. Same Portuguese word, duplicate concept.
  recommendation: merge_or_delete
  review_note: DELETE/MERGE with the other casa card and explain house/home mapping.
- id: '0375'
  word: corredor
  suspended: corredor can be corridor/hallway and also runner. The generic cleaning sentence hides that ambiguity.
  recommendation: rewrite_then_review
  review_note: Rewrite the intended household sense explicitly.
  proposed_front: O quarto fica no fim do {{corridor}}.
  proposed_back: O quarto fica no fim do corredor.<br>The room is at the end of the corridor/hallway.<br><br><b>corredor</b> here is the household “corridor/hallway” sense.
- id: '0377'
  word: duche
  suspended: duche is a useful EP noun, but “clean the shower” is less useful than tomar um duche / tomar banho.
  recommendation: rewrite_then_review
  review_note: Rewrite as a daily-life phrase.
  proposed_front: Vou tomar um {{shower}}.
  proposed_back: Vou tomar um duche.<br>I'm going to take a shower.<br><br><b>tomar um duche</b> is the standard European Portuguese collocation.
- id: 0379
  word: estante
  suspended: estante can be shelf/bookcase/shelving unit; English “bookcase” may be too narrow.
  recommendation: rewrite_then_review
  review_note: Rewrite with a visible-object context and explain the range.
  proposed_front: Os livros estão na {{bookcase / shelving unit}}.
  proposed_back: Os livros estão na estante.<br>The books are on the bookcase/shelving unit.<br><br><b>estante</b> is a shelving unit/bookcase; depending context English may use “shelf” or “bookcase”.
- id: 0386
  word: portão
  suspended: portão is useful, but generic cleaning context is artificial.
  recommendation: rewrite_then_review
  review_note: Rewrite with opening/closing/access.
  proposed_front: Pode fechar o {{gate}}?
  proposed_back: Pode fechar o portão?<br>Can you close the gate?<br><br><b>portão</b> = a large gate, often at the entrance to a property/garage.
- id: 0387
  word: quarto
  suspended: quarto is both room/bedroom and “fourth”; the current cue “(bed)room” still leaves ambiguity in the note.
  recommendation: rewrite_then_review
  review_note: Rewrite with bedroom context and note the ordinal homonym.
  proposed_front: O meu {{bedroom}} fica no primeiro andar.
  proposed_back: O meu quarto fica no primeiro andar.<br>My bedroom is on the first floor.<br><br><b>quarto</b> = room/bedroom; it is also the ordinal “fourth”. This context forces the room sense.
- id: 0393
  word: armadilha
  suspended: armadilha is lower-priority and often useful figuratively; “I use the trap” is generic.
  recommendation: keep_suspended
  review_note: Keep suspended for A1 or rewrite in a story context.
- id: 0394
  word: boneca
  suspended: boneca means doll but also wrist in Portuguese. The current card ignores a major second meaning.
  recommendation: keep_suspended
  review_note: Split doll vs wrist senses or keep suspended until needed.
- id: 0395
  word: caderno
  suspended: caderno = notebook/exercise book; English notebook can also suggest a laptop. Generic sentence gives no clue.
  recommendation: rewrite_then_review
  review_note: Rewrite as school/study context.
  proposed_front: Escrevi a palavra no {{notebook}}.
  proposed_back: Escrevi a palavra no caderno.<br>I wrote the word in the notebook.<br><br><b>caderno</b> = paper notebook/exercise book; do not confuse it with a laptop computer.
- id: 0396
  word: caneca
  suspended: caneca = mug is fine; the sentence is just too generic.
  recommendation: rewrite_then_review
  review_note: Rewrite in café/kitchen context or unsuspend if useful.
  proposed_front: Queria uma {{mug}} grande para chá.
  proposed_back: Queria uma caneca grande para chá.<br>I'd like a large mug for tea.<br><br><b>caneca</b> = mug, usually larger and more cylindrical than a <i>chávena</i>.
- id: '0401'
  word: chávena
  suspended: chávena is high-value EP vocabulary (cup), but generic sentence wastes it.
  recommendation: rewrite_then_review
  review_note: 'Rewrite in café context: “Uma chávena de café…”'
  proposed_front: Queria uma {{cup}} de café.
  proposed_back: Queria uma chávena de café.<br>I'd like a cup of coffee.<br><br><b>chávena</b> = cup, especially the cup used for coffee/tea in European Portuguese. Contrast <b>caneca</b> = mug.
- id: '0407'
  word: ferramenta
  suspended: ferramenta is useful but broad; generic sentence gives no specific retrieval cue.
  recommendation: rewrite_then_review
  review_note: Rewrite around fixing/repairing something.
  proposed_front: Preciso de uma {{tool}} para arranjar isto.
  proposed_back: Preciso de uma ferramenta para arranjar isto.<br>I need a tool to fix this.<br><br><b>ferramenta</b> = tool. <b>arranjar</b> commonly means fix/repair in Portugal.
- id: '0410'
  word: jarro
  suspended: jarro can be jug/pitcher/vase depending context; “jug” alone may not uniquely map.
  recommendation: rewrite_then_review
  review_note: Rewrite with water/table context and explain variants.
  proposed_front: Pode trazer um {{jug}} de água?
  proposed_back: Pode trazer um jarro de água?<br>Can you bring a jug/pitcher of water?<br><br><b>jarro</b> here = jug/pitcher. The table/water context removes other possible senses.
- id: '0411'
  word: jornal
  suspended: jornal means newspaper; English 'journal' is a tempting false friend. Current card should exploit that rather than “I use”.
  recommendation: rewrite_then_review
  review_note: Rewrite to emphasize newspaper vs revista/journal.
  proposed_front: Li a notícia no {{newspaper}}.
  proposed_back: Li a notícia no jornal.<br>I read the news item in the newspaper.<br><br><b>jornal</b> = newspaper/news publication. English “journal” is a false-friend trap in many contexts.
- id: '0412'
  word: lápis
  suspended: lápis is basic and generic; likely low-value rather than wrong.
  recommendation: keep_suspended
  review_note: Keep suspended.
- id: '0414'
  word: loiça
  suspended: loiça is very useful in Portugal, but “crockery” is an uncommon English cue and may be less intuitive than dishes/tableware.
  recommendation: rewrite_then_review
  review_note: Rewrite translation to dishes/tableware and use washing-up context.
  proposed_front: Tenho de lavar a {{dishes / tableware}}.
  proposed_back: Tenho de lavar a loiça.<br>I have to wash the dishes.<br><br><b>loiça</b> in European Portuguese = dishes/crockery/tableware collectively. It is commonly used as a mass noun.
