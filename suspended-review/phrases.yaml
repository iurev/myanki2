cards:
- id: 0678
  word: Como está?
  suspended: Como está? is not simply “formal”; it is the 3rd-person/polite-address form and can be used with o senhor/a senhora/você or omitted subject. The register label is oversimplified.
  recommendation: rewrite_then_review
  review_note: Keep, but rewrite back to explain polite/3rd-person address and contrast with Como estás?
  proposed_front: How are you? (polite / 3rd-person address)
  proposed_back: Como está?<br>How are you?<br><br><b>Como está?</b> uses the 3rd-person verb form and is appropriate with polite/implicit <i>você / o senhor / a senhora</i> depending context. Contrast informal <b>Como estás?</b>.
- id: 0679
  word: Como estás?
  suspended: Como estás? is specifically tu 2nd-person singular. “informal” is broadly right but the grammatical reason matters more than the label.
  recommendation: rewrite_then_review
  review_note: Keep, but explain tu-form and contrast with Como está?
  proposed_front: How are you? (informal <i>tu</i>)
  proposed_back: Como estás?<br>How are you?<br><br><b>estás</b> is the <i>tu</i> form of <i>estar</i>. Contrast polite/3rd-person <b>Como está?</b>.
- id: 0680
  word: Bem, obrigado.
  suspended: Bem, obrigado. is extremely basic and predictable.
  recommendation: keep_suspended
  review_note: Keep suspended; TA/listening material already covers this better.
- id: 0688
  word: peço desculpa
  suspended: Peço desculpa is standard/polite “I’m sorry / I apologize”; calling it “formal” is too narrow.
  recommendation: rewrite_then_review
  review_note: Rewrite translation/register note; useful phrase for Portugal.
  proposed_front: I apologize / I'm sorry for the delay.
  proposed_back: Peço desculpa pelo atraso.<br>I apologize / I'm sorry for the delay.<br><br><b>pedir desculpa</b> literally “ask forgiveness” = apologize/say sorry. <b>pelo = por + o</b>. Very normal in Portugal.
- id: 0690
  word: (muito) obrigada
  suspended: The card teaches only obrigada, i.e. the form said by a female speaker. For production this is wrong for a male learner; for recognition it is incomplete.
  recommendation: merge_or_delete
  review_note: MERGE into obrigado / obrigada with explanation that agreement follows the speaker.
- id: 0691
  word: de nada
  suspended: de nada is basic and highly overlearned.
  recommendation: keep_suspended
  review_note: Keep suspended; no need for a dedicated production card.
- id: 0693
  word: até logo
  suspended: até logo is basic and likely already automatic.
  recommendation: keep_suspended
  review_note: Keep suspended; better encountered in audio/TA.
- id: 0709
  word: isso mesmo
  suspended: 'isso mesmo has several natural renderings: exactly, that’s right, that’s it, precisely. The English cue allows multiple interpretations and gives no usage context.'
  recommendation: rewrite_then_review
  review_note: Rewrite with a mini-dialogue so isso mesmo is the natural response.
  proposed_front: — É esta rua? — {{That's right / exactly.}}
  proposed_back: — É esta rua? — Isso mesmo.<br>— Is it this street? — That's right / Exactly.<br><br><b>isso mesmo</b> confirms that the other person has identified or understood the right thing.
- id: '0711'
  word: se calhar
  suspended: se calhar is a very useful EP expression, but plain “maybe” collides directly with talvez and loses the colloquial/register nuance.
  recommendation: rewrite_then_review
  review_note: Rewrite with context and explain se calhar ≈ maybe/perhaps, very common in Portugal.
  proposed_front: '{{Maybe}} amanhã chove.'
  proposed_back: Se calhar amanhã chove.<br>Maybe it'll rain tomorrow.<br><br><b>se calhar</b> = maybe/perhaps, extremely common in conversational European Portuguese. Despite containing <i>se</i>, learn it as a fixed discourse chunk.
- id: '0717'
  word: que disparate
  suspended: que disparate is valid but relatively situational; “what nonsense” is acceptable. Likely suspended as low priority, not because wrong.
  recommendation: keep_suspended
  review_note: Keep suspended for A1 unless conversational reactions are a goal; TA-style audio context would make it better.
- id: 0718
  word: que pena
  suspended: que pena is often “what a pity / that’s too bad”. English “what a shame” can also suggest que vergonha, creating a semantic collision.
  recommendation: rewrite_then_review
  review_note: Rewrite cue to “what a pity / that’s too bad” and use a mini-dialogue.
  proposed_front: — O concerto foi cancelado. — {{That's too bad.}}
  proposed_back: — O concerto foi cancelado. — Que pena.<br>— The concert was cancelled. — That's too bad / What a pity.<br><br><b>que pena!</b> expresses regret or sympathy about an unfortunate situation.
- id: 0719
  word: só
  suspended: só conflates at least “only/just” and “alone”. A single English cue “just, only” does not teach its important ambiguity, and Level0 now covers só in context.
  recommendation: keep_suspended
  review_note: Keep suspended or split meanings; rely on Level0 contextual cards.
- id: '0722'
  word: ainda não
  suspended: ainda não = not yet is correct, but this was suspended after your Level0 work and is now directly redundant with richer contextual Level0 cards.
  recommendation: keep_suspended
  review_note: Keep suspended. No need to repair unless you want a listening-only phrase.
