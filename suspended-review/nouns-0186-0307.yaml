- id: '0202'
  word: oportunidade
  suspended: This belongs to the mass-suspended “A X é importante” batch. oportunidade is useful but nearly cognate-like and deserves a real collocation.
  recommendation: rewrite_then_review
  review_note: Rewrite as “É uma boa oportunidade.” / “Não quero perder esta oportunidade.”
  proposed_front: Não quero perder esta {{opportunity}}.
  proposed_back: Não quero perder esta oportunidade.<br>I don't want to miss this opportunity.<br><br><b>perder uma oportunidade</b> = miss/lose an opportunity, a useful collocation.
- id: '0203'
  word: paciência
  suspended: This belongs to the mass-suspended “A X é importante” batch. paciência is high-value in fixed expressions, but the generic template misses them.
  recommendation: rewrite_then_review
  review_note: Rewrite as “Não tenho paciência.” / “Tenha paciência.”
  proposed_front: Não tenho {{patience}} para esperar mais.
  proposed_back: Não tenho paciência para esperar mais.<br>I don't have the patience to wait any longer.<br><br><b>ter paciência</b> = have patience; <i>Tenha paciência</i> can mean “please be patient”.
- id: '0207'
  word: proposta
  suspended: This belongs to the mass-suspended “A X é importante” batch. proposta can be proposal/offer/suggestion depending context; the generic sentence hides this polysemy.
  recommendation: rewrite_then_review
  review_note: Rewrite in a work or offer context and explain the intended sense.
  proposed_front: A empresa fez-me uma {{proposal}} de trabalho.
  proposed_back: A empresa fez-me uma proposta de trabalho.<br>The company made me a job proposal/offer.<br><br><b>fazer uma proposta</b> = make a proposal/offer. In work context <i>proposta</i> can overlap with English “offer”.
- id: 0208
  word: salvação
  suspended: This belongs to the mass-suspended “A X é importante” batch. salvação is lower-frequency and often religious/literary; generic template makes it poor A1 material.
  recommendation: keep_suspended
  review_note: Keep suspended unless reading material makes it relevant.
- id: '0210'
  word: significado
  suspended: This belongs to the mass-suspended “A X é importante” batch. significado is useful, but “meaning is important” is unnatural pedagogically.
  recommendation: rewrite_then_review
  review_note: Rewrite as “Qual é o significado desta palavra?”
  proposed_front: Qual é o {{meaning}} desta palavra?
  proposed_back: Qual é o significado desta palavra?<br>What is the meaning of this word?<br><br><b>significado</b> = meaning/significance. <i>desta = de + esta</i>.
