cards:
- id: 0189
  word: burocracia
  suspended: This belongs to the mass-suspended “A X é importante” batch. burocracia is a transparent cognate and “A burocracia é importante” is semantically empty.
  recommendation: rewrite_then_review
  review_note: 'Rewrite only if useful: “A burocracia em Portugal pode demorar.”'
  proposed_front: A {{bureaucracy}} em Portugal pode demorar.
  proposed_back: A burocracia em Portugal pode demorar.<br>Bureaucracy in Portugal can take time.<br><br>This gives <b>burocracia</b> an actual administrative context instead of the empty template “X is important”.
- id: 0190
  word: ciência
  suspended: This belongs to the mass-suspended “A X é importante” batch. ciência is a transparent cognate; the template gives no memorable context.
  recommendation: keep_suspended
  review_note: Probably keep suspended unless you want general academic vocabulary.
- id: 0191
  word: coincidência
  suspended: This belongs to the mass-suspended “A X é importante” batch. coincidência is transparent and the template wastes a very natural phrase.
  recommendation: rewrite_then_review
  review_note: Rewrite as “Que coincidência!” — much more useful.
  proposed_front: Que {{coincidence}}! Também moro em Lisboa.
  proposed_back: 'Que coincidência! Também moro em Lisboa.<br>What a coincidence! I also live in Lisbon.<br><br><b>Que + noun!</b> is a common exclamation pattern: <i>Que coincidência!</i>'
- id: 0193
  word: hipótese
  suspended: This belongs to the mass-suspended “A X é importante” batch. hipótese is transparent; “is important” does not distinguish hypothesis/chance/possibility senses.
  recommendation: rewrite_then_review
  review_note: 'Rewrite in context: “Há uma hipótese de chover.” or scientific hipótese, depending the meaning you want.'
  proposed_front: Há uma {{possibility}} de chover amanhã.
  proposed_back: Há uma hipótese de chover amanhã.<br>There is a possibility that it will rain tomorrow.<br><br><b>hipótese</b> can mean a scientific hypothesis, but also a possibility/chance in everyday Portuguese. This card teaches the latter.
- id: 0194
  word: história
  suspended: This belongs to the mass-suspended “A X é importante” batch. história is actually important because it can mean history or story, but the card tests only an isolated English gloss in a useless sentence.
  recommendation: rewrite_then_review
  review_note: Split/clarify history vs story with contextual examples.
  proposed_front: Ele contou-me uma {{story}} engraçada.
  proposed_back: Ele contou-me uma história engraçada.<br>He told me a funny story.<br><br><b>história</b> can mean both “story” and “history”. Context decides; this card deliberately trains the everyday “story” sense.
- id: 0195
  word: informação
  suspended: This belongs to the mass-suspended “A X é importante” batch. informação is transparent and the sentence teaches almost nothing.
  recommendation: rewrite_then_review
  review_note: Rewrite as “Preciso de mais informações.” if kept.
  proposed_front: Preciso de mais {{information}} sobre a consulta.
  proposed_back: Preciso de mais informação sobre a consulta.<br>I need more information about the appointment.<br><br><b>informação</b> works as a mass noun here. You will also very often see plural <i>informações</i> for pieces/details of information.
