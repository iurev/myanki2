- id: 0297
  word: livraria
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. livraria is high-value because it is NOT library. The current template fails to exploit the false-friend contrast.
  recommendation: rewrite_then_review
  review_note: 'Rewrite explicitly: livraria = bookstore; biblioteca = library.'
  proposed_front: Comprei este livro numa {{bookstore}}.
  proposed_back: Comprei este livro numa livraria.<br>I bought this book in a bookstore.<br><br><b>livraria</b> = bookstore/bookshop; <b>biblioteca</b> = library. <b>numa = em + uma</b>.
