- id: '0216'
  word: alforreca
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. alforreca is Portugal-relevant beach vocabulary, but “I see the jellyfish” is a weak context and the word is lower-frequency.
  recommendation: keep_suspended
  review_note: Keep if coastal vocabulary matters; rewrite as a warning/sign context such as “Há alforrecas na água.”
  proposed_front: Vi uma {{jellyfish}} na água.
  proposed_back: Vi uma alforreca na água.<br>I saw a jellyfish in the water.<br><br><b>alforreca</b> is the common European Portuguese word for jellyfish.
- id: '0225'
  word: criatura
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. criatura is a transparent/literary general noun; template adds little.
  recommendation: keep_suspended
  review_note: Low priority; keep suspended.
- id: '0250'
  word: braço
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. braço is useful, but body vocabulary deserves a functional context; “I see the arm” is unnatural.
  recommendation: rewrite_then_review
  review_note: Rewrite “Dói-me o braço.” and contrast braço vs mão.
  proposed_front: Dói-me o {{arm}}.
  proposed_back: Dói-me o braço.<br>My arm hurts.<br><br><b>braço</b> = arm. Contrast <b>mão</b> = hand. <i>Dói-me X</i> is a very useful body-pain pattern.
- id: '0255'
  word: criança
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. criança is very useful, but the article a is grammatical gender and not the child’s sex; the template can mislead.
  recommendation: rewrite_then_review
  review_note: Rewrite in a real-life sentence and explain criança is grammatically feminine for boys and girls.
  proposed_front: Há uma {{child}} a brincar no parque.
  proposed_back: Há uma criança a brincar no parque.<br>There is a child playing in the park.<br><br><b>criança</b> is grammatically feminine even when the child is a boy; grammatical gender does not identify the child's sex.
- id: 0259
  word: lábio
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. lábio is useful health/body vocab; current sentence is artificial.
  recommendation: rewrite_then_review
  review_note: Rewrite around pain/injury/body description.
  proposed_front: Cortei o {{lip}}.
  proposed_back: Cortei o lábio.<br>I cut my lip.<br><br><b>lábio</b> = lip; plural <i>lábios</i>. The injury context makes this body word easier to retrieve.
- id: '0260'
  word: mão
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. mão is extremely useful; current sentence is too trivial.
  recommendation: rewrite_then_review
  review_note: Rewrite “Lave as mãos” / “Dói-me a mão.”
  proposed_front: Dói-me a {{hand}}.
  proposed_back: 'Dói-me a mão.<br>My hand hurts.<br><br><b>mão</b> is feminine despite ending in <i>-ão</i>: <b>a mão</b>, plural <b>as mãos</b>.'
- id: '0264'
  word: ombro
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. ombro is useful; current sentence is artificial.
  recommendation: rewrite_then_review
  review_note: Rewrite “Dói-me o ombro.”
  proposed_front: Dói-me o {{shoulder}}.
  proposed_back: Dói-me o ombro.<br>My shoulder hurts.<br><br><b>ombro</b> = shoulder. This is more useful than the generic “I see the shoulder” template.
- id: '0267'
  word: pescoço
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. pescoço is useful; current sentence is artificial.
  recommendation: rewrite_then_review
  review_note: Rewrite “Tenho dor no pescoço.”
  proposed_front: Tenho dor no {{neck}}.
  proposed_back: Tenho dor no pescoço.<br>I have pain in my neck.<br><br><b>no = em + o</b>. <b>dor no pescoço</b> is a normal health-context phrase.
- id: 0269
  word: pulmão
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. pulmão is medical vocabulary, useful for reading but not early daily speech; current sentence is artificial.
  recommendation: keep_suspended
  review_note: Keep suspended unless health vocab is a goal; rewrite in a medical context if kept.
- id: '0270'
  word: rapariga
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. rapariga is specifically important in Portugal, but English “girl” is age/register-sensitive and the template gives no clue.
  recommendation: rewrite_then_review
  review_note: Rewrite with an adult/young-woman context and note EP usage.
  proposed_front: Aquela {{young woman / girl}} trabalha aqui.
  proposed_back: Aquela rapariga trabalha aqui.<br>That young woman/girl works here.<br><br>In European Portuguese <b>rapariga</b> is an ordinary word for a girl/young woman. Its connotations differ in some other Portuguese varieties.
- id: '0271'
  word: sangue
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. sangue is useful health vocabulary; “I see the blood” is strange as a learning sentence.
  recommendation: rewrite_then_review
  review_note: Rewrite “Há sangue aqui” / medical context.
  proposed_front: Há {{blood}} na camisola.
  proposed_back: Há sangue na camisola.<br>There is blood on the shirt.<br><br><b>sangue</b> = blood. <b>há</b> = there is/are.
- id: '0272'
  word: arco
  suspended: 'This belongs to the mass-suspended “Eu vejo…” batch. arco is highly polysemous: arch, bow, arc. “I see the arch” selects one sense but the note label does not.'
  recommendation: rewrite_then_review
  review_note: Split senses or make the card explicitly “arco (arch)”.
  proposed_front: Passámos por baixo de um {{arch}} de pedra.
  proposed_back: Passámos por baixo de um arco de pedra.<br>We passed under a stone arch.<br><br><b>arco</b> has several senses (arch, bow, arc). This context explicitly trains the architectural “arch” sense.
- id: '0276'
  word: biblioteca
  suspended: This belongs to the mass-suspended “Eu vejo…” batch. biblioteca is useful mainly because learners confuse it with livraria; the template misses that contrast.
  recommendation: rewrite_then_review
  review_note: 'Rewrite as a contrast card: biblioteca = library, livraria = bookstore.'
  proposed_front: Vou à {{library}} devolver um livro.
  proposed_back: Vou à biblioteca devolver um livro.<br>I'm going to the library to return a book.<br><br><b>biblioteca</b> = library. Contrast <b>livraria</b> = bookstore/bookshop. <b>à = a + a</b>.
