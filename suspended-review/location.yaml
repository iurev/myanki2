cards:
- id: 0583
  word: em direção a
  suspended: “O gato está em direção à casa” is unnatural because em direção a expresses movement/orientation toward a goal; estar is a poor verb here. English “toward” is also a preposition while the Portuguese target is a phrase.
  recommendation: rewrite_then_review
  review_note: 'FIX: “O gato vai/caminha em direção à casa.”'
  proposed_front: O gato caminha {{toward}} a casa.
  proposed_back: 'O gato caminha em direção à casa.<br>The cat walks toward the house.<br><br><b>em direção a</b> = toward / in the direction of. Before feminine <i>a casa</i>: <b>a + a → à</b>.'
- id: 0584
  word: em frente
  suspended: 'em frente is ambiguous/incomplete here: it can mean straight ahead / opposite / in front depending construction. “O gato está em frente” lacks the reference point expected by English “in front”.'
  recommendation: rewrite_then_review
  review_note: REWRITE into either “Siga em frente” = go straight ahead or “O gato está em frente da casa”/better location phrasing depending intended sense.
  proposed_front: Siga {{straight ahead}}.
  proposed_back: Siga em frente.<br>Go straight ahead.<br><br><b>em frente</b> is the fixed directions phrase “straight ahead/forward”. This is more useful and less ambiguous than the original location fragment.
