cards:
- id: 0418
  word: mochila
  suspended: mochila is useful but generic/easy.
  recommendation: keep_suspended
  review_note: Keep suspended or use travel context.
- id: '0425'
  word: revista
  suspended: revista can mean magazine; English cue is okay, but the word also participates in other senses and the sentence is generic.
  recommendation: rewrite_then_review
  review_note: Rewrite in reading/newsstand context.
  proposed_front: Comprei uma {{magazine}} no quiosque.
  proposed_back: Comprei uma revista no quiosque.<br>I bought a magazine at the kiosk.<br><br><b>revista</b> = magazine; <i>jornal</i> is newspaper.
- id: 0428
  word: tinta
  suspended: tinta can mean ink or paint. Cue “ink” selects one meaning but the note is polysemous.
  recommendation: rewrite_then_review
  review_note: Split or explain tinta de impressora vs tinta de parede.
- id: '0430'
  word: aluno
  suspended: aluno overlaps with estudante. 'student' alone does not tell you which word to produce; aluno is more school/pupil/class-member oriented.
  recommendation: rewrite_then_review
  review_note: Rewrite with classroom context and contrast aluno vs estudante.
  proposed_front: Ele é {{a pupil/student}} nesta escola.
  proposed_back: Ele é aluno nesta escola.<br>He is a pupil/student at this school.<br><br><b>aluno</b> means a learner enrolled in a class/school/course. <b>estudante</b> is the broader “student/person who studies”.
- id: '0436'
  word: diretor
  suspended: diretor is a transparent cognate and profession card; after 3 reps + lapse it may simply have been not worth the scheduling cost.
  recommendation: keep_suspended
  review_note: Keep suspended unless job/work vocabulary needs it.
- id: '0441'
  word: faroleiro
  suspended: faroleiro is niche vocabulary (lighthouse keeper).
  recommendation: keep_suspended
  review_note: Keep suspended for A1; only useful for specific reading.
- id: '0442'
  word: guarda
  suspended: guarda overlaps with guardião, segurança, vigilante. Generic “guard” is not unique.
  recommendation: merge_or_delete
  review_note: Rewrite or merge with guardião; choose a concrete job/context.
  proposed_front: O {{guard}} está à entrada.
  proposed_back: O guarda está à entrada.<br>The guard is at the entrance.<br><br><b>guarda</b> can name a guard/watchman in this context. Do not confuse this noun use with the verb <i>guardar</i>.
- id: '0443'
