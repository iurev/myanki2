- id: '0453'
  word: professor
  suspended: professor can mean teacher/professor depending setting, while English “teacher” may also be professor/docente. This is a useful false-friend/semantic-range card, but current template is too crude.
  recommendation: rewrite_then_review
  review_note: Rewrite with school/university context and explanation.
  proposed_front: Ela é {{teacher}} numa escola primária.
  proposed_back: Ela é professora numa escola primária.<br>She is a teacher at a primary school.<br><br><b>professor/professora</b> is the normal Portuguese word for teacher and also for university lecturers/professors; context supplies the level.
