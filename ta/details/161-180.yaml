161: <b>Translation:</b> Can I come in?<br><br><b>entrar</b> = enter/go in.<br><br><b>posso entrar?</b> = may/can I enter? The subject <i>eu</i> is unnecessary because <i>posso</i> already marks 1st person.
162: <b>Translation:</b> We’re not working because of the strike / because of the holiday.<br><br><b>por causa de</b> = because of, followed by a noun.<br><br><b>da greve</b> = <i>de + a greve → da greve</i>; <b>do feriado</b> would similarly be <i>de + o feriado → do feriado</i>.<br><br><b>greve</b> = strike; <b>feriado</b> = public holiday.
163: <b>Translation:</b> I’m very sorry / I’m sorry / My condolences.<br><br><b>sinto muito</b> literally “I feel much” = I’m very sorry; used for bad news or sympathy.<br><br><b>lamento</b> = I regret / I’m sorry, from <i>lamentar</i>.<br><br><b>os meus sentimentos</b> literally “my feelings” is the standard phrase “my condolences”, specifically for bereavement.
164: <b>Translation:</b> Yeah / indeed, that makes sense.<br><br><b>pois</b> is a very Portuguese discourse word. Depending on tone/context it can mean “yes/indeed/well/so”. Here it acknowledges what was said.<br><br><b>faz sentido</b> literally “makes sense”, exactly parallel to English.<br><br>Do not force one fixed English translation onto <i>pois</i>; learn its conversational function from context.
165: <b>Translation:</b> I’m very embarrassed.<br><br><b>embaraçado/embaraçada</b> = embarrassed/awkward, not “pregnant”.<br><br><b>estou</b> uses <i>estar</i> for a current emotional state.<br><br><b>muito</b> = very; the adjective changes with the speaker’s gender.
166: '<b>Translation:</b> I’m not understanding / I don’t understand.<br><br><b>estou a perceber</b> is European Portuguese progressive: <i>estar a + infinitive</i> = be doing. So <i>não estou a perceber</i> = I’m not following/understanding.<br><br><b>não percebo</b> is simple present = I don’t understand.<br><br><b>perceber</b> can mean perceive, notice, realize, or understand; English <i>perceive</i> is a close etymological relative.'
167: <b>Translation:</b> Is this water drinkable?<br><br><b>potável</b> = potable/drinkable; English <i>potable</i> is the direct useful cognate.<br><br><b>esta água</b> = this water. <i>esta</i> is feminine because <i>água</i> is grammatically feminine despite beginning with a stressed <i>a</i>.
168: <b>Translation:</b> What are you going to do today? / What are your plans?<br><br><b>vais fazer</b> = informal <i>tu</i> “you are going to do”, <i>ir + infinitive</i> for future/intention.<br><br><b>quais são</b> = which ones are / what are, plural because <i>planos</i> is plural.<br><br><b>os teus planos</b> = your plans; article + possessive is normal in European Portuguese.
169: '<b>Translation:</b> How long do I have to wait?<br><br><b>tenho de esperar</b> = I have to wait; <i>ter de + infinitive</i>.<br><br><b>quanto tempo</b> = how much time/how long.<br><br>Portuguese can leave the question phrase at the end: literally “I have to wait how much time?”'
170: <b>Translation:</b> All right, I’m not in a hurry.<br><br><b>tudo bem</b> literally “everything well” = okay/all right.<br><br><b>ter pressa</b> = be in a hurry, literally “have hurry”.<br><br><b>não tenho pressa</b> = I’m not in a hurry.
171: <b>Translation:</b> Admission is free on Mondays.<br><br><b>a entrada</b> = entry/admission.<br><br><b>gratuita</b> = free of charge, feminine because <i>entrada</i> is feminine.<br><br><b>às segundas-feiras</b> = on Mondays. Plural weekday + <i>às</i> expresses a recurring schedule.
172: <b>Translation:</b> Do you work on Wednesdays? / Is it open on Wednesdays?<br><br><b>às quartas-feiras / às quartas</b> = on Wednesdays. The shortened weekday name is very common.<br><br><b>está aberto</b> = is open; <i>estar</i> describes the current/scheduled state of the establishment.<br><br><b>trabalha</b> can mean “do you work” or “does it/that person work”, depending on subject/context.
173: '<b>Translation:</b> They don’t work on Saturdays and Sundays.<br><br><b>aos sábados</b> = <i>a + os sábados → aos sábados</i>, “on Saturdays”.<br><br>Portuguese weekday/weekend recurrence can use an article + <i>a</i> contraction: <i>aos sábados</i>, <i>às segundas</i>.<br><br><b>domingos</b> appears here without a repeated <i>aos</i>; the coordination shares the time frame.'
174: <b>Translation:</b> Sorry for being late / sorry for the delay.<br><br><b>pelo</b> = <i>por + o</i>.<br><br><b>atraso</b> = delay/lateness. <i>Desculpe pelo atraso</i> literally “excuse [me] for the delay”.<br><br>Useful both for arriving late and for service delays.
175: <b>Translation:</b> Cheers! / Bless you! (to a man / to a woman)<br><br><b>Saúde!</b> literally “health!” = cheers when drinking; it can also be said after a sneeze in some contexts.<br><br><b>Santinho!</b> / <b>Santinha!</b> literally “little saint” masculine/feminine, a traditional Portugal response to a sneeze, similar to “bless you”.<br><br>The gendered form matches the person who sneezed.
176: <b>Translation:</b> Can I smoke here? / Can you bring an ashtray?<br><br><b>fumar</b> = smoke; <b>cinzeiro</b> = ashtray, from <i>cinza</i> = ash.<br><br><b>posso + infinitive</b> asks permission; <b>pode + infinitive</b> asks the other person to do something.
177: '<b>Translation:</b> My car broke down / Your computer broke down.<br><br><b>avariou</b> is simple past of <i>avariar</i>: broke down / malfunctioned.<br><br><b>avaria</b> = breakdown/fault. This is a very common Portugal word for machines, cars, lifts, equipment.<br><br><b>o meu / o teu</b> = my / your, with the usual definite article.'
178: <b>Translation:</b> Are you going up or down?<br><br><b>vai subir / descer</b> literally “are you going to go up / go down”. This is common in a lift/elevator.<br><br><b>subir</b> = go up/ascend; <b>descer</b> = go down/descend. English <i>descend</i> is an easy cognate hook for <i>descer</i>.
179: <b>Translation:</b> Excuse me, do you have a phone charger?<br><br><b>carregador</b> = charger, from <i>carregar</i> = load/charge/carry.<br><br><b>telemóvel</b> is the standard European Portuguese word for mobile phone.<br><br><b>tem…?</b> = do you have…? polite/service form.
180: <b>Translation:</b> Who is next?<br><br><b>quem é que…?</b> is the focused question frame; <i>é que</i> usually has no separate English translation.<br><br><b>está a seguir</b> literally “is following/next”. In a queue this means “is next”.<br><br>Recognize the whole service phrase <b>Quem é que está a seguir?</b>