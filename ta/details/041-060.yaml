41: '<b>Translation:</b> I’d like to pay.<br><br><b>queria</b> is imperfect of <i>querer</i>, literally “wanted”, but very commonly softens a present request: “I would like”.<br><br>So <b>Queria pagar</b> is much more natural as a polite service phrase than the literal “I wanted to pay”.'
42: <b>Translation:</b> We’ll split the bill / We’ll pay separately.<br><br><b>vamos dividir</b> = “we are going to divide”, using <i>ir + infinitive</i>; in context, “let’s / we’ll split”.<br><br><b>a conta</b> = the bill/check.<br><br><b>em separado</b> = separately; literally “in separate [fashion]”.
43: '<b>Translation:</b> Bring the bill, please / Can you bring the bill?<br><br><b>traga</b> is a formal/polite command from <i>trazer</i>: “bring”.<br><br><b>pode trazer…?</b> = can you bring…? This is less command-like and very common.<br><br><b>a conta</b> in restaurant context = the bill/check.'
44: <b>Translation:</b> Can I pay by card / by Multibanco?<br><br><b>pagar com</b> = pay with/by means of.<br><br><b>cartão</b> = card. <b>Multibanco</b> in Portugal can refer to the national ATM/payment network and, colloquially in shops, card payment/terminal context.<br><br><b>posso pagar</b> = can I pay.
45: <b>Translation:</b> Can you add a tip to the bill?<br><br><b>gorjeta</b> = tip/gratuity.<br><br><b>adicionar X a Y</b> = add X to Y. <i>a + a conta → à conta</i>, hence <b>à conta</b>.<br><br><b>pode adicionar…?</b> is the standard polite request frame.
46: <b>Translation:</b> I don’t need the change / You can keep the change.<br><br><b>troco</b> = change (money returned after payment).<br><br><b>precisar de</b> = need; <i>não preciso do troco</i> has <i>de + o → do</i>.<br><br><b>pode ficar com</b> literally “you can stay/remain with” → “you can keep”.
47: <b>Translation:</b> How much does it cost? / How much is it?<br><br><b>quanto</b> = how much. <b>custa</b> = costs, from <i>custar</i>.<br><br><b>Quanto é?</b> literally “How much is it?” is a very common short price question.
48: <b>Translation:</b> What is the price of one kilo?<br><br><b>qual é o preço de…?</b> = what is the price of…?<br><br><b>um quilo</b> = one kilogram. <i>quilo</i> is the everyday shortened form of <i>quilograma</i>.
49: <b>Translation:</b> Can I taste it? (food) / Can I try it? (other item)<br><br><b>provar</b> often means taste/try food, but can also mean try on/test depending on context.<br><br><b>experimentar</b> = try/test/experience; useful for products, activities, etc.<br><br><b>posso + infinitive</b> = may/can I do X.
50: '<b>Translation:</b> Can you clean / prepare the fish, please?<br><br><b>limpar</b> = clean; at a fish counter this can mean gut/clean the fish.<br><br><b>arranjar</b> is broad European Portuguese: fix/prepare/sort out. Here it means prepare the fish for cooking.<br><br><b>pode + infinitive</b> is the polite request pattern.'
51: <b>Translation:</b> Three hundred grams of shrimp, please.<br><br><b>trezentos gramas</b> = three hundred grams. <i>grama</i> is grammatically masculine in this measurement sense, hence <i>trezentos</i>.<br><br><b>de camarão</b> = of shrimp; <i>de</i> links the quantity to the item being bought.
52: <b>Translation:</b> A large chicken with giblets / without giblets.<br><br><b>frango</b> = chicken (as food / a young chicken).<br><br><b>miúdos</b> literally can mean “small things”, but in food context means giblets/offal.<br><br><b>com / sem</b> = with / without.
53: <b>Translation:</b> That’s fine, thank you.<br><br><b>está bom</b> literally = “it is good”, but in service interactions it often means “that’s enough / that’s fine / okay”.<br><br><b>está</b> uses <i>estar</i> because this is an assessment of the current amount/situation.
54: <b>Translation:</b> Can you cut it into large pieces?<br><br><b>cortar</b> = cut.<br><br><b>em pedaços</b> = into pieces. Portuguese uses <i>em</i> where English naturally says “into” in this result/state pattern.<br><br><b>grandes</b> agrees with plural <i>pedaços</i>.
55: <b>Translation:</b> Where can I weigh this?<br><br><b>pesar</b> = weigh; related to <i>peso</i> = weight.<br><br><b>isto</b> = this thing/this, used without a following noun. Compare <i>este/esta + noun</i>.<br><br><b>onde posso + infinitive</b> = where can I do X?
56: '<b>Translation:</b> I’m just going to have a look / browse.<br><br><b>dar uma vista de olhos</b> is an idiom, literally “give a view/glance of the eyes”, meaning “have a look / browse”.<br><br><b>vou dar</b> uses <i>ir + infinitive</i> for immediate intention: “I’m going to have a look”.<br><br>Very useful when a shop assistant approaches and you do not need help yet.'
57: '<b>Translation:</b> Do you have it in another colour?<br><br><b>noutra</b> = <i>em + outra → noutra</i>, literally “in another”.<br><br>The object is omitted because it is obvious from context: <i>Tem [isto] noutra cor?</i><br><br><b>cor</b> = colour, feminine.'
58: <b>Translation:</b> Do you have this in size M (medium)?<br><br><b>no tamanho</b> = <i>em + o tamanho → no tamanho</i>, “in size”.<br><br><b>isto</b> points to the item without naming it.<br><br><b>médio</b> = medium, here explaining the letter M.
59: '<b>Translation:</b> Do you have my size?<br><br><b>o meu tamanho</b> = my size. In European Portuguese possessives commonly appear with the definite article: <i>o meu, a minha</i>.<br><br><b>tem…?</b> is the usual polite shop pattern “do you have…?”'
60: <b>Translation:</b> Where are the fitting rooms?<br><br><b>ficar</b> often means “to be located” when talking about places. <b>Onde ficam…?</b> = where are … located?<br><br><b>provadores</b> = fitting/changing rooms; from <i>provar</i> = try on/test.