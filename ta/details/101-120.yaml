101: '<b>Translation:</b> I’m from…<br><br><b>sou de</b> = I am from. Portuguese uses <i>ser + de</i> for origin.<br><br>With countries/cities, articles vary: <i>sou de Lisboa</i>, <i>sou de Portugal</i>, but <i>sou do Brasil</i> = <i>de + o Brasil → do Brasil</i>.'
102: <b>Translation:</b> My number is 987 654 321 0.<br><br><b>o meu número</b> = my number; article + possessive is normal in European Portuguese.<br><br>Phone numbers are often spoken digit by digit. This card is useful primarily for recognizing the Portuguese number words quickly in audio.
103: <b>Translation:</b> My NIF (taxpayer number) is 123456789.<br><br><b>NIF</b> = <i>Número de Identificação Fiscal</i>, the Portuguese tax identification number.<br><br><b>número de contribuinte</b> is the everyday older/descriptive phrase you will also hear at checkouts.<br><br><b>o meu ... é</b> = my ... is.
104: <b>Translation:</b> Good morning! / Good afternoon!<br><br><b>bom dia</b> literally “good day” is used in the morning.<br><br><b>boa tarde</b> = good afternoon. <i>bom → boa</i> because <i>tarde</i> is feminine.<br><br>These greetings are extremely common in Portugal when entering shops, cafés, lifts, reception desks, etc.
105: <b>Translation:</b> See you Tuesday!<br><br><b>até</b> = until / up to; in farewells it means “until [that time]” → “see you…”.<br><br><b>Até terça!</b> is an elliptical form of “until Tuesday / see you Tuesday”.
106: <b>Translation:</b> Have a good weekend!<br><br><b>bom fim de semana</b> literally = good end of week → good weekend.<br><br><b>fim</b> = end; <i>de semana</i> = of the week. This is a standard farewell before the weekend.
107: <b>Translation:</b> Have a good Friday!<br><br><b>sexta</b> is the common short form of <i>sexta-feira</i> = Friday.<br><br><b>boa</b> agrees with the implied feminine <i>sexta(-feira)</i>.<br><br>This is an informal friendly wish, analogous to “have a good Friday”.
108: <b>Translation:</b> Give my regards to Alexandra / Ricardo!<br><br><b>manda</b> is the informal <i>tu</i> imperative/present-form request from <i>mandar</i>, literally send.<br><br><b>mandar cumprimentos a alguém</b> = send/give regards to someone.<br><br><b>à Alexandra</b> = <i>a + a → à</i>; <b>ao Ricardo</b> = <i>a + o → ao</i>.
109: <b>Translation:</b> See you next time! / See you soon! / See you tomorrow.<br><br><b>até</b> in farewells = “until” → “see you”.<br><br><b>à próxima</b> = until the next [time/occasion]; <i>a + a → à</i>.<br><br><b>breve</b> = soon/shortly; <b>amanhã</b> = tomorrow.
110: '<b>Translation:</b> We’ll see each other in half an hour.<br><br><b>vemo-nos</b> = <i>vemos + nos</i> with the final <i>-s</i> dropped before <i>nos</i>: “we see each other”. This is a reciprocal use of the pronoun.<br><br><b>daqui a</b> + time period = “in [time from now]”. Literally “from here to…”.<br><br><b>meia hora</b> = half an hour; <i>meia</i> agrees with feminine <i>hora</i>.'
111: <b>Translation:</b> Good evening / good night!<br><br><b>boa noite</b> serves both “good evening” and “good night” depending on context.<br><br><b>boa</b> is feminine because <i>noite</i> is feminine.
112: '<b>Translation:</b> Sorry, I can’t talk right now.<br><br><b>não posso</b> = I cannot, from <i>poder</i>.<br><br><b>falar</b> = speak/talk. Pattern: <i>poder + infinitive</i>.<br><br><b>agora</b> = now/right now.'
113: <b>Translation:</b> Who is it? / Who’s speaking?<br><br><b>quem</b> = who.<br><br><b>Quem é?</b> literally “Who is [it]?”; <b>Quem fala?</b> literally “Who speaks/is speaking?”<br><br>Both are natural phone questions when you do not know the caller.
114: '<b>Translation:</b> Hello? / Hello, are you there?<br><br><b>Estou?</b> and <b>Está?</b> are traditional telephone-answering expressions in European Portuguese.<br><br>Literally they are forms of <i>estar</i> (“am I? / are you?”), but do not translate them word-for-word here: functionally they are like “Hello?” / “Are you there?” on the phone.<br><br><i>Estou?</i> is especially characteristic of Portugal.'
115: <b>Translation:</b> I’m not interested, sorry.<br><br><b>estar interessado em</b> = be interested in. Here the complement is omitted because the topic is obvious.<br><br><b>interessado/interessada</b> agrees with the speaker’s grammatical gender.<br><br><b>desculpe</b> softens the refusal.
116: '<b>Translation:</b> Sorry, I’m very busy.<br><br><b>estou ocupado/ocupada</b> uses <i>estar</i> for a current state: I am busy.<br><br><b>muito</b> before an adjective = very and does not change for gender.<br><br><i>ocupado/a</i> does change to agree with the speaker.'
117: <b>Translation:</b> Can you spell it?<br><br><b>soletrar</b> = spell out letter by letter.<br><br><b>pode + infinitive</b> = can/could you…? The object (“it / your name / that word”) is omitted because context supplies it.
118: <b>Translation:</b> Sorry, I don’t have time for that.<br><br><b>ter tempo</b> = have time.<br><br><b>para isso</b> = for that; <i>isso</i> refers to a previously mentioned task/idea.<br><br><b>não tenho</b> = I do not have.
119: <b>Translation:</b> Could you speak more slowly?<br><br><b>podia</b> = could, imperfect of <i>poder</i>, used to soften a request.<br><br><b>mais devagar</b> = more slowly. <i>devagar</i> = slowly.<br><br>This is one of the most useful phrases for real-life listening practice.
120: <b>Translation:</b> One more time, please.<br><br><b>mais uma vez</b> = one more time / once again. Literally “one more occurrence/time”.<br><br><b>vez</b> = time/turn/occasion.<br><br><b>se faz favor</b> = please, especially common in Portugal.