1: '<b>Translation:</b> — Do you want to eat here or is it to take away? — To take away.<br><br><b>quer comer</b> = “do you want to eat”. Portuguese normally drops the subject when it is obvious. <b>quer</b> is from <i>querer</i>.<br><br><b>é para + infinitive</b> is a very common service pattern: literally “is it for doing X?”, idiomatically “is it to…?”. <b>para levar</b> = takeaway / to go.<br><br><b>levar</b> = take/carry something away from the current place; compare <b>trazer</b> = bring toward the current place.'
2: '<b>Translation:</b> Can we sit here?<br><br><b>podemos</b> = “we can / may”, from <i>poder</i>. The ending <b>-mos</b> marks <i>nós</i> (“we”), so <i>nós</i> is omitted.<br><br><b>sentar-nos</b> = <i>sentar + nos</i>. <i>sentar-se</i> is the pronominal verb “to sit down”; with the infinitive, the pronoun attaches after it in European Portuguese.<br><br>Pattern: <b>poder + infinitive</b> = can/may do something.'
3: <b>Translation:</b> — Do you have a reservation? — No, I don’t.<br><br><b>tem</b> = “you have / does he/she have”, from <i>ter</i>. In a service situation the subject is understood as polite “you”.<br><br><b>não tenho</b> literally = “I do not have”. Portuguese does not need to repeat <i>uma reserva</i>; the object is understood from context.
4: <b>Translation:</b> I have a reservation in the name of Anna.<br><br><b>em nome de</b> = “in the name of / under the name of”. This is the normal phrase for reservations and bookings.<br><br><b>de Anna</b> links the name to the reservation; <i>de</i> is the general “of/from” preposition.
5: '<b>Translation:</b> Is it necessary to reserve a table in advance?<br><br><b>é preciso + infinitive</b> = “it is necessary to / you need to”. <i>preciso</i> here is not “precise”; it means necessary.<br><br><b>com antecedência</b> = “in advance”. <i>antecedência</i> is related to English <b>antecedent</b>: something that comes before.'
6: <b>Translation:</b> Do you have a table for three people for today at 7:00 p.m.?<br><br><b>tem mesa</b> literally “have table?” = “do you have a table available?”. Portuguese often omits the article in this service pattern.<br><br><b>para três pessoas</b> = for three people; <b>para hoje</b> = for today.<br><br><b>às 19h00</b> = <i>a + as</i> (horas) → <b>às</b>. Clock time uses the preposition <i>a</i>.
7: <b>Translation:</b> Can I sit inside / outside?<br><br><b>posso</b> = “I can / may”, from <i>poder</i>.<br><br><b>sentar-me</b> = <i>sentar + me</i>, “sit myself down”. The clitic <i>me</i> attaches to the infinitive.<br><br><b>cá dentro</b> = in here / inside; <b>lá fora</b> = out there / outside. <i>cá/lá</i> add a spatial “here/there” feel.
8: <b>Translation:</b> Is this establishment pet-friendly?<br><br><b>este estabelecimento</b> = this establishment/place. <i>este</i> agrees with masculine singular <i>estabelecimento</i>.<br><br><b>é</b> is from <i>ser</i>, used for a general characteristic. The English phrase <i>pet friendly</i> is commonly understood in Portugal.
9: '<b>Translation:</b> Can I move/remove this chair?<br><br><b>tirar</b> has a broad sense: take, remove, take off, move away. Here it means moving/removing the chair.<br><br><b>esta cadeira</b> = this chair; <i>esta</i> is feminine because <i>cadeira</i> is feminine.'
10: <b>Translation:</b> Do you have a high chair / chair for a baby?<br><br><b>cadeira para bebé</b> literally = “chair for baby”, the usual transparent way to ask for a high chair.<br><br><b>tem</b> is polite service “do you have…?” with the subject omitted.
11: <b>Translation:</b> What time do you open?<br><br><b>a que horas</b> = “at what time”. The preposition <i>a</i> is the same one used in clock expressions.<br><br><b>abre</b> = “opens / do you open”, from <i>abrir</i>. The subject may be the restaurant/shop or polite “you”, understood from context.
12: '<b>Translation:</b> What time do you close?<br><br><b>fecha</b> = “closes / do you close”, from <i>fechar</i>.<br><br>Portuguese allows the question phrase at the end: <b>Fecha a que horas?</b> Literally “You close at what time?” This is very natural.'
13: '<b>Translation:</b> What are you going to drink? / And to drink?<br><br><b>o que</b> = what. <b>vai beber</b> = literally “are you going to drink”, using <i>ir + infinitive</i> for an intended/near-future action.<br><br><b>E para beber?</b> is a restaurant ellipsis: literally “And for drinking?” → “And what would you like to drink?” The omitted material is recovered from the situation.'
14: <b>Translation:</b> We need more time to look at the menu.<br><br><b>precisamos de</b> = “we need”. <i>precisar</i> normally takes <b>de</b> before a noun or infinitive in European Portuguese.<br><br><b>para ver</b> = to look at / to see; <i>para + infinitive</i> expresses purpose.<br><br><b>ementa</b> is the common Portugal word for a restaurant menu; <i>carta</i> can also mean menu/list.
15: '<b>Translation:</b> Give me two more minutes.<br><br><b>dê</b> is the formal/polite imperative of <i>dar</i> (“give”).<br><br><b>dê-me</b> = “give me”: affirmative commands attach the clitic after the verb with a hyphen.<br><br><b>mais dois minutos</b> = two more minutes; <i>mais</i> before a quantity means “another/additional”.'
16: <b>Translation:</b> I’d like to place an order.<br><br><b>gostava de</b> literally is the imperfect of <i>gostar de</i> (“liked”), but in requests it functions as a softer, polite <b>“I would like”</b>.<br><br><b>fazer um pedido</b> = make/place an order. <i>pedido</i> comes from <i>pedir</i>, “ask for / order”.
17: '<b>Translation:</b> Do you have vegetarian dishes?<br><br><b>prato</b> can mean a plate or, in restaurant context, a dish/course.<br><br><b>vegetarianos</b> agrees with masculine plural <i>pratos</i>: singular <i>vegetariano</i> → plural <i>vegetarianos</i>.'
18: <b>Translation:</b> I’m allergic to…<br><br><b>sou</b> = “I am”, from <i>ser</i>. Portuguese uses <i>ser</i> for this relatively stable characteristic.<br><br><b>alérgico/alérgica a</b> = allergic to. The adjective changes with the speaker’s grammatical gender; the following preposition is <b>a</b>.
19: <b>Translation:</b> Does this dish contain milk / nuts / eggs / meat / soy / wheat?<br><br><b>este prato tem…?</b> literally “does this dish have…?” Portuguese commonly uses <i>ter</i> where English says “contain”.<br><br><b>frutos secos</b> literally “dry fruits” is the standard European Portuguese term covering nuts/dried fruit depending on context; in allergy contexts it often points to nuts.
20: '<b>Translation:</b> Can you bring a glass of tap water?<br><br><b>pode + infinitive</b> = can/could you do something; a very common polite request pattern.<br><br><b>trazer</b> = bring toward the speaker/current place.<br><br><b>água da torneira</b> = tap water: <i>de + a torneira → da torneira</i>, literally “water of/from the tap”.'