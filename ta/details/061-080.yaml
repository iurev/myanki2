61: <b>Translation:</b> Do I need to take a number/ticket?<br><br><b>é preciso + infinitive</b> = it is necessary to / do I need to.<br><br><b>tirar senha</b> in Portugal means take a queue ticket/number. Here <i>senha</i> is not “password” but a numbered ticket/token.<br><br>Context decides the meaning of <i>senha</i>.
62: '<b>Translation:</b> What is your queue number?<br><br><b>qual é</b> asks for a particular value: “what/which is”.<br><br><b>a sua senha</b> = your ticket/number. <i>sua</i> agrees with feminine <i>senha</i>, not with the person addressed.'
63: <b>Translation:</b> Would you like chilled/cool water or room-temperature water?<br><br><b>água fresca</b> = cool/chilled water in this service context.<br><br><b>água natural</b> often means still and/or unchilled/room-temperature depending on the setting; this card contrasts it with <i>fresca</i>, so temperature is the intended contrast.<br><br><b>quer…?</b> = do you want / would you like?
64: <b>Translation:</b> I want to get/make a loyalty card.<br><br><b>quero + infinitive</b> = I want to do X.<br><br><b>fazer um cartão</b> literally “make a card” = get/sign up for a card.<br><br><b>fidelidade</b> = loyalty; compare English <i>fidelity</i>, from the same Latin family.
65: <b>Translation:</b> Is it a gift? / Is it for a gift?<br><br><b>é para + noun</b> = is it for…?<br><br><b>oferta</b> can mean offer, gift, or promotional offering. In a shop, <b>É para oferta?</b> usually asks whether the purchase is a gift, often because they can gift-wrap it.
66: '<b>Translation:</b> — Do you need a bag? — Yes, give me a bag, please.<br><br><b>precisa de</b> = need. <i>precisar</i> takes <b>de</b>: <i>precisa de saco?</i><br><br><b>dê-me</b> = formal/polite imperative <i>dê</i> + clitic <i>me</i>: “give me”.<br><br><b>saco</b> = bag.'
67: <b>Translation:</b> Can it be with a tax number?<br><br><b>pode ser…?</b> literally “can it be…?” is a very common Portuguese service phrase meaning “is X okay / can we do it as X?”.<br><br><b>número de contribuinte</b> = taxpayer number, i.e. NIF in Portugal.<br><br>At checkout this means adding your NIF to the receipt/invoice.
68: '<b>Translation:</b> I am / am not in the queue.<br><br><b>estar na fila</b> = be in the queue/line; <i>em + a fila → na fila</i>.<br><br>Adding <b>não</b> directly before the verb negates it: <i>não estou na fila</i>.'
69: <b>Translation:</b> Excuse me, are you in the queue?<br><br><b>desculpe</b> is the polite/formal “excuse me / sorry”.<br><br><b>está na fila?</b> literally “are [you] in the line?” The subject is omitted; the polite 3rd-person verb form is enough in context.
70: <b>Translation:</b> Can you change the fifty euros into ten-euro notes? Can you change five euros into coins?<br><br><b>trocar</b> = exchange/change/swap.<br><br><b>notas de dez</b> = ten-euro notes/bills; <b>moedas</b> = coins.<br><br>The construction with <i>com</i> is understandable as “change using/for notes or coins”; in natural English we say “change into/for”.
71: <b>Translation:</b> Will you have change for twenty / thirty / fifty euros?<br><br><b>vai ter</b> = “will you have / are you going to have”, from <i>ir + ter</i>.<br><br><b>troco de vinte euros</b> = change for a twenty-euro amount/note in context.<br><br>This is useful before paying with a relatively large note.
72: '<b>Translation:</b> Sorry, but the label had a different price.<br><br><b>tinha</b> is the imperfect of <i>ter</i>: “had”. It describes the price shown on the label as a background state.<br><br><b>etiqueta</b> = label/tag; <b>preço diferente</b> = different price.<br><br><b>mas</b> introduces the correction/contrast.'
73: <b>Translation:</b> Where is the exit?<br><br><b>onde é…?</b> literally “where is…?” using <i>ser</i>; for locations you will also very often hear <b>onde fica…?</b>.<br><br><b>saída</b> = exit, from <i>sair</i> = go out/leave.
74: <b>Translation:</b> What time will you deliver? / When does the order arrive?<br><br><b>vão entregar</b> = “you/they are going to deliver”, <i>ir + infinitive</i>.<br><br><b>encomenda</b> = order/package/consignment, depending on context.<br><br><b>chega</b> = arrives, from <i>chegar</i>. Present tense is commonly used for scheduled future events.
75: <b>Translation:</b> Do you deliver (to the home)?<br><br><b>fazer entregas</b> = make deliveries → deliver.<br><br><b>ao domicílio</b> = to the home/address; <i>a + o → ao</i>. This is a standard commercial phrase for home delivery.
76: <b>Translation:</b> Can you send an email / a message with this information?<br><br><b>enviar</b> = send.<br><br><b>com esta informação</b> = with this information; <i>esta</i> points to information currently being discussed.<br><br><b>pode + infinitive</b> again forms a polite request.
77: <b>Translation:</b> Can you make me a copy of this document?<br><br><b>fazer-me</b> = <i>fazer + me</i>, “make for me”. The clitic attaches to the infinitive after <i>pode</i>.<br><br><b>deste documento</b> = <i>de + este → deste</i>, “of this document”.<br><br>So the structure is literally “Can [you] make-me a copy of-this document?”
78: <b>Translation:</b> I need to print this file in black and white / in colour.<br><br><b>preciso de imprimir</b> = I need to print; <i>precisar</i> takes <b>de</b> before the infinitive.<br><br><b>ficheiro</b> is the standard European Portuguese word for computer “file”.<br><br><b>em preto e branco</b> = in black and white; <b>a cores</b> = in colour.
79: <b>Translation:</b> — Just an initial/signature. — Is it here?<br><br><b>só</b> = only/just.<br><br><b>rúbrica</b> in administrative context means an abbreviated signature/initialing mark; <b>assinatura</b> = full signature.<br><br><b>É aqui?</b> literally “Is it here?” = “Do I sign/initial here?” with the action omitted because context supplies it.
80: <b>Translation:</b> Can you write that down?<br><br><b>isso</b> = that (idea/thing near the listener or already mentioned), used without a noun.<br><br><b>pode escrever…?</b> = can you write…? In context, “can you write that down?”