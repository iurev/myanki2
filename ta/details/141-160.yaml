141: '<b>Translation:</b> I don’t mind.<br><br><b>importar-se</b> can mean mind/care/be bothered. <b>não me importo</b> = I do not mind.<br><br>Because of <b>não</b>, the clitic comes before the verb: <i>não me importo</i>.<br><br>Do not confuse this with <i>importar</i> = import.'
142: '<b>Translation:</b> Thank you for your help / I appreciate your help.<br><br><b>pela</b> = <i>por + a</i>: “for the”. So <i>obrigado pela sua ajuda</i> = thank you for your help.<br><br><b>agradeço</b> = I thank/appreciate, from <i>agradecer</i>.<br><br><b>sua</b> agrees with feminine <i>ajuda</i>.'
143: <b>Translation:</b> I’m sure.<br><br>Portuguese commonly says <b>ter a certeza</b> = literally “have the certainty” → be sure.<br><br><b>tenho</b> = I have; <b>a certeza</b> = the certainty.<br><br>Compare <i>Não tenho a certeza</i> = I’m not sure.
144: <b>Translation:</b> Wait, please.<br><br><b>espere</b> is the formal/polite imperative of <i>esperar</i> = wait/hope/expect.<br><br>The same verb has several meanings; context makes “wait” obvious here.<br><br><b>por favor</b> = please.
145: <b>Translation:</b> Where is the bathroom?<br><br><b>onde fica…?</b> = where is … located? <i>ficar</i> is one of the most common verbs for asking locations.<br><br><b>casa de banho</b> = bathroom/toilet in Portugal.
146: '<b>Translation:</b> What time is it?<br><br><b>que horas</b> = what hours; <i>horas</i> is plural because clock time is conceptualized through “hours”.<br><br><b>são</b> = are, from <i>ser</i>. Literally “What hours are [they]?”<br><br>For 1:00 Portuguese uses singular: <i>É uma hora.</i>'
147: <b>Translation:</b> What is this / that?<br><br><b>isto</b> = this, neutral/standalone; <b>isso</b> = that, neutral/standalone.<br><br>They do not change for gender or number and are used when the noun is unknown, omitted, or the whole situation/thing is being pointed to.<br><br>Compare <i>este livro / essa cadeira</i> when a noun follows.
148: '<b>Translation:</b> Excuse me, do you work here? / Do you, sir / ma’am, work here?<br><br><b>você trabalha</b>, <b>o senhor trabalha</b>, <b>a senhora trabalha</b> all use 3rd-person singular verb agreement.<br><br>In Portugal, explicit <i>você</i> can sound marked depending on region/register; <i>o senhor/a senhora</i> is clearly polite/formal, and often the pronoun is simply omitted: <i>Trabalha aqui?</i>.<br><br><b>desculpe</b> politely gets attention.'
149: '<b>Translation:</b> You’re very kind/nice!<br><br><b>simpático</b> usually means nice, friendly, pleasant, kind — not English “sympathetic”. This is a false friend.<br><br><b>é</b> from <i>ser</i> describes a perceived characteristic.<br><br>For a woman: <i>É muito simpática!</i>'
150: <b>Translation:</b> Can I take a photo?<br><br><b>tirar uma foto</b> = take a photo. <i>tirar</i> literally has senses like take/remove, but this phrase is fixed and very common.<br><br><b>posso + infinitive</b> = may/can I do X.
151: '<b>Translation:</b> Show me what it’s like / show me how it is.<br><br><b>mostra-me</b> = informal <i>tu</i> form <i>mostra</i> + clitic <i>me</i>: “show me”. Affirmative commands attach the pronoun after the verb.<br><br><b>como é</b> literally = “how it is / what it is like”.<br><br>So the whole phrase asks someone to demonstrate or show what something is like.'
152: <b>Translation:</b> I don’t have any money with me.<br><br><b>comigo</b> = with me. It is a special fused form historically from <i>com + mim</i>.<br><br><b>ter dinheiro consigo/comigo</b> = have money on one’s person / with oneself.<br><br><b>não tenho</b> = I don’t have.
153: <b>Translation:</b> Do you know who the owner of this dog is?<br><br><b>sabe quem é…?</b> = do you know who ... is? <i>saber</i> is used for knowing information/facts.<br><br><b>o dono</b> = the owner (male/default form); <i>dona</i> for a female owner.<br><br><b>deste cão</b> = <i>de + este → deste</i>, “of this dog”.
154: <b>Translation:</b> Can you close the door/window, please?<br><br><b>fechar</b> = close/shut.<br><br><b>pode + infinitive</b> = can/could you…? polite request.<br><br><b>a porta / a janela</b> are feminine nouns, hence the article <i>a</i>.
155: <b>Translation:</b> Do you need help?<br><br><b>precisar de</b> = need. <i>Precisa de ajuda?</i> literally “Need of help?”<br><br>The subject is omitted; the 3rd-person form <i>precisa</i> is polite/neutral in a service interaction.
156: <b>Translation:</b> I don’t know.<br><br><b>sei</b> = I know, irregular 1st-person of <i>saber</i>.<br><br><b>não</b> before the verb gives <i>não sei</i>.<br><br>Use <i>saber</i> for facts/information; <i>conhecer</i> is more for being acquainted with people/places.
157: <b>Translation:</b> I have to go.<br><br><b>ter de + infinitive</b> = have to / must do something, especially common in European Portuguese.<br><br><b>tenho de ir</b> literally “I have of/to go”. Treat <i>ter de</i> as one grammatical chunk.
158: <b>Translation:</b> I can’t do anything.<br><br><b>não posso</b> = I cannot, from <i>poder</i>.<br><br><b>nada</b> = nothing/anything in a negative clause. Portuguese normally allows <i>não ... nada</i> together.<br><br>So <i>não posso fazer nada</i> literally “I cannot do nothing” but means “I can’t do anything”.
159: '<b>Translation:</b> What can I do? / How can I help?<br><br><b>o que</b> = what; <b>como</b> = how.<br><br><b>posso fazer</b> = I can do; <b>posso ajudar</b> = I can help. Pattern: <i>poder + infinitive</i>.<br><br>The explicit <i>eu</i> in <i>O que eu posso fazer?</i> is optional; Portuguese often says simply <i>O que posso fazer?</i>.'
160: '<b>Translation:</b> Thank you. / You’re welcome.<br><br><b>obrigado/obrigada</b> agrees historically with the speaker: a man traditionally says <i>obrigado</i>, a woman <i>obrigada</i>.<br><br><b>de nada</b> literally “of nothing” = you’re welcome / no problem.<br><br>This is the basic thank-you exchange.'