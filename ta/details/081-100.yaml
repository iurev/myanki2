81: '<b>Translation:</b> How is it spelled?<br><br><b>como</b> = how.<br><br><b>se escreve</b> literally “it writes itself / is written” uses impersonal/passive-like <i>se</i>. Idiomatically: “how do you write/spell it?”<br><br>This <i>se</i> is not the conditional <i>se</i> = if.'
82: <b>Translation:</b> Write your phone number / email here.<br><br><b>escreva</b> is the polite/formal imperative of <i>escrever</i>.<br><br><b>o seu número</b> = your number. <i>seu</i> agrees with masculine <i>número</i>.<br><br><b>aqui</b> = here.
83: <b>Translation:</b> I think there is an error here.<br><br><b>acho que</b> = literally “I find/think that” → “I think that”. <i>que</i> introduces the clause.<br><br><b>há</b> = there is/are, impersonal <i>haver</i>.<br><br><b>um erro</b> = an error; transparent cognate with English.
84: <b>Translation:</b> We have to call an ambulance.<br><br><b>temos de + infinitive</b> = we have to / must do something. This is extremely common in European Portuguese.<br><br><b>temos</b> = we have, from <i>ter</i>; <b>chamar</b> = call/summon.<br><br><b>a ambulância</b> = the ambulance.
85: <b>Translation:</b> Is it possible to book me for an earlier/closer date?<br><br><b>é possível + infinitive</b> = is it possible to…<br><br><b>marcar-me</b> = book/schedule me; <i>marcar</i> is the everyday verb for booking appointments.<br><br><b>mais próxima</b> literally “closer”, here = sooner/earlier in time. The adjective agrees with feminine <i>data</i>.
86: '<b>Translation:</b> I need to reschedule my medical appointment.<br><br><b>preciso de + infinitive</b> = I need to do X.<br><br><b>reagendar</b> = reschedule: <i>re-</i> + <i>agendar</i> (“put on the agenda/schedule”).<br><br><b>consulta médica</b> = medical appointment/consultation.'
87: <b>Translation:</b> Does this doctor have an agreement with any insurer?<br><br><b>ter um acordo com</b> = have an agreement/contract with.<br><br><b>alguma</b> = any/some, feminine because <i>seguradora</i> is feminine.<br><br><b>seguradora</b> = insurance company/insurer; from <i>seguro</i> = insurance/safe.
88: <b>Translation:</b> I want to make an appointment with my family doctor.<br><br><b>marcar uma consulta</b> = book an appointment.<br><br><b>médico de família</b> = family doctor / GP in Portugal.<br><br><b>para o meu médico</b> is the card’s phrasing; in ordinary speech you may also hear <i>com o meu médico de família</i> for an appointment with that doctor.
89: '<b>Translation:</b> What time should I arrive?<br><br><b>devo</b> = I should / must, from <i>dever</i>.<br><br><b>a que horas</b> = at what time.<br><br><b>chegar</b> = arrive. Pattern: <b>dever + infinitive</b> = should/ought to do X.'
90: <b>Translation:</b> The doctor sees patients on Thursdays.<br><br><b>atender</b> = attend to / serve / see patients. In a clinic, <i>o médico atende</i> = the doctor is seeing patients.<br><br><b>às quintas-feiras</b> = on Thursdays. Plural weekday with <i>às</i> expresses a recurring weekly schedule.
91: <b>Translation:</b> Do you have the medicines on this list?<br><br><b>medicamentos</b> = medicines/medications.<br><br><b>desta lista</b> = <i>de + esta → desta</i>, “from/on this list”.<br><br><b>tem…?</b> is again the polite “do you have…?” service pattern.
92: <b>Translation:</b> Where is… the supermarket / the pharmacy?<br><br><b>onde fica…?</b> = where is … located? <i>ficar</i> is extremely common for location.<br><br><b>supermercado</b> = supermarket; <b>farmácia</b> = pharmacy.<br><br>For asking directions, <b>Onde fica X?</b> is one of the most useful templates.
93: '<b>Translation:</b> Go ahead, please / Go ahead!<br><br><b>passe</b> is the polite imperative of <i>passar</i>: pass/go ahead.<br><br><b>Força!</b> literally “strength!”, but conversationally in Portugal it often means “go ahead / sure / come on”, depending on context.<br><br>This is a good example where literal translation is misleading.'
94: <b>Translation:</b> You can go ahead / go in front.<br><br><b>passar à frente</b> = go ahead of someone / move to the front.<br><br><b>à frente</b> = <i>a + a frente → à frente</i>, literally “to/in the front”.<br><br>In a queue this is permission to take the speaker’s place ahead.
95: <b>Translation:</b> Excuse me / sorry.<br><br><b>com licença</b> literally “with permission” = excuse me, especially when passing, entering, interrupting, or asking someone to move.<br><br><b>desculpe</b> = excuse me / sorry, from <i>desculpar</i> = excuse/forgive.<br><br>They overlap, but <i>com licença</i> is often more about requesting space/permission; <i>desculpe</i> often acknowledges inconvenience or gets attention.
96: <b>Translation:</b> Can you take a photo? Landscape / portrait.<br><br><b>tirar uma foto</b> = take a photo; <i>tirar</i> has many meanings, and with <i>foto</i> it means “take”.<br><br><b>no horizontal / no vertical</b> = in horizontal / vertical orientation. <i>no = em + o</i>.<br><br>Natural English uses “landscape / portrait”.
97: '<b>Translation:</b> Can you help me? I need your help.<br><br><b>ajudar-me</b> = <i>ajudar + me</i>, “help me”; the clitic attaches after the infinitive.<br><br><b>preciso da sua ajuda</b> = I need your help: <i>precisar de + a → da</i>.<br><br><b>sua</b> agrees with feminine <i>ajuda</i>.'
98: <b>Translation:</b> Where can I withdraw cash?<br><br><b>levantar dinheiro</b> in Portugal commonly means withdraw money/cash, especially from an ATM or bank.<br><br>Literal <i>levantar</i> is “raise/lift”, but this banking meaning is standard.<br><br><b>onde posso…?</b> = where can I…?
99: <b>Translation:</b> My name is Konstantin and I’m a programmer. My name is Ekaterina and I’m a psychologist.<br><br><b>o meu nome</b> = my name; European Portuguese normally uses the article with possessives.<br><br><b>sou</b> = I am, from <i>ser</i>, used for profession/identity.<br><br><b>programador / psicóloga</b> show gender agreement in profession nouns/adjectives.
100: <b>Translation:</b> What is your profession?<br><br><b>qual é</b> = which/what is, asking for a specific value/category.<br><br><b>a sua profissão</b> = your profession. <i>sua</i> agrees with feminine <i>profissão</i>.<br><br>In everyday conversation you may also hear <i>O que faz?</i> = What do you do?