21: <b>Translation:</b> Still water, please / Sparkling water without ice, please.<br><br><b>água natural</b> in Portugal usually means still/non-sparkling water, often at room temperature depending on context; <b>água com gás</b> = sparkling water.<br><br><b>sem gelo</b> = without ice.<br><br><b>se faz favor</b> is a very common Portugal equivalent of “please”, historically something like “if you do the favor”.
22: '<b>Translation:</b> I’m going to order a dish of…<br><br><b>vou pedir</b> = <i>ir + infinitive</i>: “I’m going to order / I’ll order”.<br><br><b>pedir</b> means ask for and, in restaurant context, order.<br><br><b>um prato de X</b> = a dish of X; <i>de</i> introduces the content/type.'
23: '<b>Translation:</b> Meat doneness: rare / medium-rare / medium / medium-well / well-done.<br><br><b>ponto da carne</b> = degree of doneness of meat. <i>ponto</i> here means stage/degree, not “point” in the geometric sense.<br><br><b>mal passado</b> literally “little/poorly passed/cooked” = rare; <b>bem passado</b> = well-done.<br><br><b>médio</b> = medium; the compounds express intermediate levels.'
24: <b>Translation:</b> How long is it going to take?<br><br><b>quanto tempo</b> = how much time / how long.<br><br><b>vai demorar</b> = <i>ir + infinitive</i> → “is going to take”. <i>demorar</i> means take time / be delayed / last.
25: <b>Translation:</b> Nothing else / That’s all.<br><br><b>mais nada</b> literally = “more nothing” → “nothing else”. Portuguese places <i>mais</i> before <i>nada</i>.<br><br><b>só isso</b> = only that → that’s all. <i>só</i> limits the amount to “just/only”.
26: '<b>Translation:</b> I’ve already ordered / I haven’t ordered yet.<br><br><b>pedi</b> is 1st-person singular simple past of <i>pedir</i>: “I asked for / ordered”.<br><br><b>já pedi</b> = the ordering event has been reached by now → “I’ve already ordered”.<br><br><b>ainda não pedi</b> literally “I still haven’t ordered”: <i>ainda</i> says the negative state continues, so English naturally uses “not yet”.'
27: '<b>Translation:</b> Is there Wi‑Fi here?<br><br><b>há</b> is from the impersonal verb <i>haver</i> and means “there is / there are”. It stays singular: <i>há wifi, há mesas, há pessoas</i>.<br><br><b>aqui</b> = here. Pattern: <b>aqui há X?</b> = is there X here?'
28: <b>Translation:</b> What is the Wi‑Fi password?<br><br><b>qual é</b> = which one is / what is, used when asking for a specific value from a set of possibilities.<br><br><b>senha</b> = password/code. In Portugal you may also encounter <i>palavra-passe</i> for “password”.
29: <b>Translation:</b> Could you turn the air conditioning on / off?<br><br><b>podia</b> is imperfect <i>poder</i> (“could”), commonly used as a softer request than <i>pode</i>.<br><br><b>ligar</b> = switch on/connect/call; <b>desligar</b> = switch off/disconnect.<br><br><b>ar condicionado</b> = air conditioning.
30: '<b>Translation:</b> One more glass, please.<br><br><b>mais um</b> = one more / another one. This is a very productive pattern: <i>mais um café, mais uma água</i>.<br><br><b>copo</b> = drinking glass/cup depending on context; <i>se faz favor</i> = please.'
31: <b>Translation:</b> Could you bring the cutlery? Could you bring a fork, a spoon, a knife?<br><br><b>talheres</b> = cutlery/flatware as a collective plural.<br><br><b>garfo</b> = fork, <b>colher</b> = spoon, <b>faca</b> = knife.<br><br><b>podia trazer…?</b> uses imperfect <i>poder</i> to make the request softer/politer.
32: <b>Translation:</b> Can you bring me the salt, please?<br><br><b>trazer-me</b> = <i>trazer + me</i>, literally “bring to me”. In an affirmative infinitive phrase the clitic attaches after the verb.<br><br><b>o sal</b> = the salt; Portuguese normally uses the article with the concrete item being requested.
33: '<b>Translation:</b> Where can I get/find napkins?<br><br><b>onde posso</b> = where can I; <i>posso</i> is 1st-person <i>poder</i>.<br><br><b>arranjar</b> is very common in Portugal and can mean get, obtain, find, arrange, fix depending on context. Here: “get/find”.<br><br><b>guardanapos</b> = napkins.'
34: '<b>Translation:</b> Thank you. Everything was delicious / tasty / excellent / very good.<br><br><b>tudo</b> = everything.<br><br><b>estava</b> is the imperfect of <i>estar</i>: “was”. It describes the state/quality of the food during the meal.<br><br><b>delicioso, saboroso, ótimo, muito bom</b> are alternative positive evaluations; <i>saboroso</i> literally relates to <i>sabor</i> = taste/flavour.'
35: <b>Translation:</b> I’ve already finished / We’ve already finished.<br><br><b>terminei</b> = I finished; <b>terminamos</b> = we finished. Both are simple past forms of <i>terminar</i>.<br><br><b>já</b> marks that the expected endpoint has already been reached.
36: '<b>Translation:</b> I’m not hungry.<br><br>Portuguese expresses hunger with <b>ter</b> (“to have”): <b>ter fome</b> = literally “have hunger”.<br><br><b>não tenho fome</b> therefore literally = “I don’t have hunger”, idiomatically “I’m not hungry”.'
37: '<b>Translation:</b> Thanks, I can’t eat any more.<br><br><b>já não</b> = no longer / not anymore: the state has changed by now from YES to NO.<br><br><b>consigo</b> = I manage / am able, from <i>conseguir</i>. <b>não consigo comer</b> = I can’t manage to eat.<br><br><b>mais</b> after the verb = any more / further.'
38: <b>Translation:</b> I’m full / I’m satisfied.<br><br><b>estou</b> = “I am”, from <i>estar</i>, because this is a current temporary state.<br><br><b>cheio/cheia</b> literally = full; <b>satisfeito/satisfeita</b> = satisfied. The adjective agrees with the speaker’s grammatical gender.
39: <b>Translation:</b> Would you like a dessert?<br><br><b>vai querer</b> literally = “are you going to want”, but in service speech it is a very common polite way of asking what the customer would like next.<br><br><b>uma sobremesa</b> = a dessert; literally historically “over/after the table/meal” in the sense of the course after the main meal.
40: <b>Translation:</b> Can I use your bathroom?<br><br><b>vossa</b> = your (plural/formal-group possessive), agreeing with feminine <i>casa</i>.<br><br><b>casa de banho</b> literally “house/room of bathing” = bathroom/toilet in Portugal.<br><br><b>posso usar</b> = may/can I use.