121: <b>Translation:</b> Can you speak more quietly / louder?<br><br><b>mais baixo</b> literally “lower” → more quietly; <b>mais alto</b> literally “higher” → louder.<br><br><b>falar baixo/alto</b> describes voice volume, not physical height.<br><br><b>pode falar…?</b> = can you speak…?
122: '<b>Translation:</b> Who can I speak to about…?<br><br><b>com quem</b> = with whom. Portuguese naturally keeps the preposition before the question word.<br><br><b>posso falar</b> = can I speak.<br><br><b>sobre</b> = about/on. Pattern: <b>Com quem posso falar sobre X?</b>'
123: <b>Translation:</b> Congratulations! / Happy birthday!<br><br><b>parabéns</b> = congratulations; also commonly said by itself for birthdays.<br><br><b>feliz aniversário</b> literally = happy anniversary/birthday; <i>aniversário</i> is the yearly recurrence of a date.<br><br>In birthday context both are normal.
124: <b>Translation:</b> Merry Christmas and Happy New Year!<br><br><b>Feliz Natal</b> = Merry/Happy Christmas.<br><br><b>Bom Ano Novo</b> literally “good new year”. <i>bom</i> agrees with masculine <i>ano</i>.<br><br>A standard holiday greeting in Portugal.
125: '<b>Translation:</b> I don’t speak English.<br><br><b>falo</b> = I speak, 1st-person singular of <i>falar</i>.<br><br><b>não</b> directly before the verb makes the sentence negative.<br><br>Languages normally appear without an article in this simple pattern: <i>falo inglês, falo português</i>.'
126: '<b>Translation:</b> Sorry, I’m still learning Portuguese. Do you speak English?<br><br><b>ainda</b> = still: the learning process continues up to now.<br><br><b>estou a aprender</b> is the standard European Portuguese progressive: <i>estar a + infinitive</i> = be doing something now/around now.<br><br><b>fala inglês?</b> uses the polite 3rd-person form with the subject omitted.'
127: <b>Translation:</b> How do you say this in Portuguese?<br><br><b>como se diz…?</b> = how does one say / how is ... said? The <i>se</i> makes the expression impersonal.<br><br><b>isto</b> = this thing/this, standing alone.<br><br><b>em português</b> = in Portuguese.
128: <b>Translation:</b> Do you know João?<br><br><b>conheces</b> = you know/are acquainted with, informal <i>tu</i> form of <i>conhecer</i>.<br><br>Use <i>conhecer</i> for knowing a person/place through acquaintance. Compare <b>saber</b> for knowing facts or knowing how to do something.
129: <b>Translation:</b> Nice to meet you!<br><br><b>muito prazer</b> literally = “much pleasure”.<br><br><b>prazer</b> = pleasure, related to English <i>pleasure</i> through the same Latin family.<br><br>A standard introduction formula.
130: <b>Translation:</b> Do you have Multibanco? / Can I pay by card?<br><br><b>tem multibanco?</b> in a shop asks whether card/Multibanco payment is available.<br><br><b>pagar com cartão</b> = pay with/by card.<br><br>In Portugal <i>Multibanco</i> is both the national payment/ATM network name and a common everyday term around card terminals/payments.
131: <b>Translation:</b> Sorry, the ATM/card terminal / the bathroom is out of order.<br><br><b>fora de serviço</b> literally “outside of service” = out of order / unavailable.<br><br><b>está</b> uses <i>estar</i> because this is a current temporary condition.<br><br><b>multibanco</b> can mean an ATM or, in context, a payment terminal/service.
132: <b>Translation:</b> Sorry for the inconvenience.<br><br><b>pelo</b> = <i>por + o</i>. So <i>desculpe pelo incómodo</i> is literally “excuse [me] for the inconvenience”.<br><br><b>incómodo</b> = inconvenience/discomfort/annoyance.<br><br>A common formal/service apology.
133: '<b>Translation:</b> Don’t worry. / Don’t worry (informal).<br><br><b>não se preocupe</b> is formal/polite; <b>não te preocupes</b> is informal <i>tu</i>.<br><br><i>preocupar-se</i> = to worry. Negative commands place the pronoun before the verb: <i>não se preocupe</i>, not *<i>não preocupe-se</i>.<br><br>The <i>tu</i> negative command uses the present subjunctive form <i>preocupes</i>.'
134: '<b>Translation:</b> I would like…<br><br><b>queria</b> is imperfect of <i>querer</i>, literally “I wanted”, but in present-day requests it commonly softens “I want” into “I’d like”.<br><br>This is one of the most useful politeness patterns in Portugal: <i>Queria um café.</i>'
135: <b>Translation:</b> Sorry, I didn’t mean to / it was accidental.<br><br><b>foi</b> = was, simple past of <i>ser</i> here.<br><br><b>sem querer</b> literally = “without wanting” → accidentally / unintentionally.<br><br>So <i>foi sem querer</i> literally “it was without wanting” = “I didn’t mean to”.
136: '<b>Translation:</b> What’s going on? / What’s happening?<br><br><b>o que é que…?</b> is an extremely common Portuguese question frame. The extra <i>é que</i> does not add a separate English meaning; it marks/focuses the question.<br><br><b>se passa</b> = happens/is going on, from <i>passar-se</i>.<br><br>Recognize the whole chunk: <b>O que é que se passa?</b> = What’s going on?'
137: <b>Translation:</b> It’s okay / no harm done. / No problem.<br><br><b>não faz mal</b> literally “it doesn’t make/do bad” → it’s okay / no harm done.<br><br><b>não tem problema</b> literally “it has no problem” → no problem.<br><br>Both are common reassuring replies after an apology or small mistake.
138: '<b>Translation:</b> It’s hot today / it’s cold today.<br><br>Weather temperature often uses <b>estar</b>: <i>está calor, está frio</i>.<br><br><b>calor</b> is literally heat, <b>frio</b> cold.<br><br>The subject is impersonal/understood; Portuguese does not need an equivalent of English dummy “it”.'
139: <b>Translation:</b> Are you comfortable?<br><br><b>estás</b> = you are, informal <i>tu</i> form of <i>estar</i>.<br><br><b>confortável</b> = comfortable; it has the same form for masculine and feminine.<br><br>Use <i>estar</i> for the current state of comfort.
140: <b>Translation:</b> So / in that case, I’ll come back later.<br><br><b>então</b> = then / so / in that case. It links the previous situation to the decision that follows.<br><br><b>volto</b> = I return/come back, from <i>voltar</i>. Present tense can express an immediate future plan.<br><br><b>mais tarde</b> = later.