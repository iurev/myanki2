181: <b>Translation:</b> Entry is forbidden / prohibited.<br><br><b>interdita</b> = forbidden/restricted; <b>proibida</b> = prohibited.<br><br>Both adjectives are feminine because <i>entrada</i> is feminine.<br><br><i>proibido</i> is related to English <i>prohibit</i> through Latin.
182: <b>Translation:</b> One ticket to…, please.<br><br><b>um bilhete para…</b> = one ticket to/for a destination.<br><br><b>para</b> marks destination.<br><br><b>se faz favor</b> = please, especially characteristic of Portugal.
183: <b>Translation:</b> A return ticket / round-trip ticket.<br><br><b>ida</b> = going/outward journey, from <i>ir</i> = go.<br><br><b>volta</b> = return/coming back, from <i>voltar</i> = return.<br><br><b>de ida e volta</b> literally “of going and return” = round trip.
184: <b>Translation:</b> Is there any discount for children / pensioners?<br><br><b>há</b> = there is/are.<br><br><b>algum desconto</b> = any/some discount; <i>algum</i> agrees with masculine <i>desconto</i>.<br><br><b>reformados</b> in Portugal = retirees/pensioners; from <i>reformar-se</i> = retire.
185: <b>Translation:</b> From which platform does the bus / coach depart?<br><br><b>de que plataforma</b> = from which platform. The preposition <i>de</i> appears first because <i>partir de</i> = depart from.<br><br><b>parte</b> = departs/leaves, from <i>partir</i>.<br><br><b>autocarro</b> is the standard Portugal word for bus; <i>camioneta</i> can refer to a coach/bus in some contexts/regions.
186: <b>Translation:</b> Sorry, I think this seat/place is mine.<br><br><b>acho que</b> = I think that.<br><br><b>lugar</b> = place/seat depending on context; on transport it commonly means seat.<br><br><b>é meu</b> = is mine. Here <i>meu</i> is a standalone possessive agreeing with masculine <i>lugar</i>.
187: <b>Translation:</b> I want to get / top up a monthly pass.<br><br><b>passe</b> = travel pass.<br><br><b>carregar</b> literally load/charge; with a card/pass it means top up/reload.<br><br><b>passe mensal</b> = monthly pass. <i>mensal</i> is related to <i>mês</i> = month.
188: <b>Translation:</b> Can you move/pull the seat further forward?<br><br><b>puxar</b> = pull; depending on the mechanism, English may naturally say move.<br><br><b>mais para a frente</b> = further forward, literally “more toward the front”.<br><br><b>o banco</b> = seat/bench; in a car, seat.
189: <b>Translation:</b> Could you take me to this address, please?<br><br><b>podia</b> = could, softened request from imperfect <i>poder</i>.<br><br><b>levar-me</b> = take me; <i>levar + me</i> with the clitic attached to the infinitive.<br><br><b>morada</b> = address (postal/home address), a very common Portugal word.
190: <b>Translation:</b> Turn right.<br><br><b>vire</b> is the polite/formal imperative of <i>virar</i> = turn.<br><br><b>à direita</b> = to the right; <i>a + a direita → à direita</i>.<br><br>The accent on <i>à</i> marks this contraction.
191: <b>Translation:</b> Turn left.<br><br><b>vire</b> = polite/formal command “turn”.<br><br><b>à esquerda</b> = to the left; <i>a + a esquerda → à esquerda</i>.<br><br>Pair it with <i>à direita</i> = to the right.
192: <b>Translation:</b> You can follow the GPS.<br><br><b>seguir</b> = follow/continue.<br><br><b>pode seguir</b> can mean “you can follow” or a polite instruction “you may just follow”.<br><br><b>o GPS</b> is used just like in English.
193: '<b>Translation:</b> Go straight ahead.<br><br><b>siga</b> is the polite/formal imperative of <i>seguir</i> = follow/continue.<br><br><b>em frente</b> = forward/straight ahead.<br><br>Very common directions phrase: <b>Siga em frente.</b>'
194: <b>Translation:</b> Can you turn the music down a little?<br><br><b>baixar</b> = lower; with sound/music it means turn down.<br><br><b>um pouco</b> = a little.<br><br><b>a música</b> = the music. The opposite would be <i>aumentar/subir</i> the volume, depending on phrasing.
195: <b>Translation:</b> Can you stop here?<br><br><b>parar</b> = stop.<br><br><b>pode parar aqui?</b> is the standard taxi/ride phrase “Can you stop here?”<br><br><b>aqui</b> = here.
196: <b>Translation:</b> Pump 5, ten litres of regular 95 petrol.<br><br><b>bomba</b> at a fuel station = pump.<br><br><b>dez litros de</b> = ten litres of.<br><br><b>gasolina</b> = petrol/gasoline; <b>95</b> refers to the common 95-octane petrol grade. <i>simples</i> distinguishes the standard/non-premium product.
197: <b>Translation:</b> Pump 3, twenty euros of diesel.<br><br><b>vinte euros de gasóleo</b> = twenty euros’ worth of diesel.<br><br><b>gasóleo</b> is the standard European Portuguese word for diesel fuel.<br><br>At staffed/payment-first stations, naming the pump number plus amount/fuel is a natural compressed request.
198: <b>Translation:</b> I’d like to fill the tank.<br><br><b>queria</b> = I would like, polite request use of imperfect <i>querer</i>.<br><br><b>encher</b> = fill; <b>o depósito</b> = the tank/reservoir.<br><br>At a petrol station <i>encher o depósito</i> = fill up the tank.
199: <b>Translation:</b> Is this parking paid? Is it free?<br><br><b>estacionamento</b> = parking / car park.<br><br><b>pago</b> = paid/chargeable; <b>gratuito</b> = free of charge.<br><br><b>é</b> from <i>ser</i> asks about the general status/rule of the parking.
200: <b>Translation:</b> Where can I pay for parking?<br><br><b>onde posso + infinitive</b> = where can I do X?<br><br><b>pagar o estacionamento</b> = pay for parking. Portuguese often uses <i>pagar</i> directly with the thing/service being paid.<br><br>Depending on the place, this could mean the meter, machine, kiosk, or app/payment point.